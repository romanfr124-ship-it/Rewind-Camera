

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REWIND">
<title>REWIND</title>

<style>
:root {
  --black:#050505;
  --white:#fff;
  --red:#ed2424;
}
* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}
html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  touch-action:pan-y;
}
body { position:fixed; inset:0; }

#cameraCanvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:var(--black);
}
#cameraVideo {
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

/* LOGO */
.top {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 20px);
  left:22px;
  right:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}
.logo {
  width:150px;
  height:auto;
  max-height:70px;
  object-fit:contain;
  object-position:left center;
}

/* RECORDING */
.recording-label {
  display:none;
  align-items:center;
  gap:8px;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
}
.recording-label.active { display:flex; }
.recording-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  animation:blink 1s infinite;
}
@keyframes blink { 50% {opacity:.25;} }

/* LENS */
.lens-controls {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 85px);
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}
.small-control {
  min-width:65px;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:30px;
  background:rgba(0,0,0,.4);
  color:rgba(255,255,255,.65);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.5px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.small-control.active {
  color:white;
  border-color:white;
  background:rgba(255,255,255,.12);
}

/* BOTTOM */
.bottom {
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 24px);
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}
.camera-controls {
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:auto;
}
.flip-button {
  position:absolute;
  right:34px;
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.4);
  color:white;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

/* MODE SELECTOR */
.mode-selector {
  width:250px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:13px;
  touch-action:pan-y;
}
.mode-names {
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.mode-name {
  width:33.333%;
  text-align:center;
  color:rgba(255,255,255,.35);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.5px;
  transition:color .2s, opacity .2s;
}
.mode-name.active {
  color:white;
}
.shutter-row {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}
#shutter {
  width:78px;
  height:78px;
  border:3px solid white;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  touch-action:pan-y;
  outline:none;
  transition:border-color .2s, background .2s;
}
#shutter::before {
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
}
#shutter .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:white;
  transition:all .18s ease;
}

/* VIDEO: LARGE RED CENTRE */
#shutter.video-mode {
  border-color:var(--red);
}
#shutter.video-mode .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--red);
}

/* VIDEO RECORDING */
#shutter.video-mode.recording .inner {
  width:38px;
  height:38px;
  border-radius:7px;
}

/* SLOW MOTION */
#shutter.slow-mode {
  border-color:#d9d9d9;
}
#shutter.slow-mode .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:#d9d9d9;
}
#shutter.slow-mode.recording .inner {
  width:38px;
  height:38px;
  border-radius:7px;
  background:var(--red);
}

.instruction {
  margin-top:22px;
  color:rgba(255,255,255,.65);
  font-size:9px;
  font-weight:600;
  letter-spacing:2px;
  text-align:center;
}
.tagline {
  margin-top:12px;
  color:rgba(255,255,255,.35);
  font-size:9px;
  letter-spacing:3px;
  text-align:center;
}

/* START SCREEN */
#startScreen {
  position:absolute;
  z-index:10;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:var(--black);
  padding:30px;
  text-align:center;
}
.start-logo {
  width:min(75vw,330px);
  height:auto;
  margin-bottom:35px;
}
#startScreen p {
  max-width:270px;
  color:#888;
  font-size:12px;
  line-height:1.7;
  letter-spacing:1px;
  margin:0 0 28px;
}
#startButton {
  border:1px solid white;
  background:white;
  color:black;
  border-radius:30px;
  padding:15px 30px;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}
#errorMessage {
  color:#e66;
  font-size:11px;
  line-height:1.5;
  max-width:290px;
  margin-top:20px;
}
#statusMessage {
  position:absolute;
  z-index:8;
  bottom:calc(env(safe-area-inset-bottom) + 145px);
  left:20px;
  right:20px;
  text-align:center;
  font-size:10px;
  letter-spacing:1.5px;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}
#statusMessage.show { opacity:1; }

@media (orientation:landscape) {
  .top { top:calc(env(safe-area-inset-top) + 10px); }
  .logo { width:110px; }
  .lens-controls { top:calc(env(safe-area-inset-top) + 12px); }
  .bottom { bottom:calc(env(safe-area-inset-bottom) + 10px); }
  #shutter { width:68px; height:68px; }
  #shutter .inner { width:52px; height:52px; }
  #shutter.video-mode .inner,
  #shutter.slow-mode .inner { width:52px; height:52px; }
  #shutter.video-mode.recording .inner,
  #shutter.slow-mode.recording .inner {
    width:34px;
    height:34px;
  }
  .instruction { margin-top:10px; }
  .tagline { margin-top:6px; }
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay muted playsinline></video>
<canvas id="cameraCanvas"></canvas>

<header class="top">
  <img class="logo" src="680A3BE0-D839-47C8-8C90-0FE9BD1F2173.png" alt="REWIND">
  <div class="recording-label" id="recordingLabel">
    <span class="recording-dot"></span>
    <span id="recordingTime">REC 00:00</span>
  </div>
</header>

<div class="lens-controls">
  <button class="small-control active" id="circleButton">CIRCLE</button>
  <button class="small-control" id="fullButton">FULL FRAME</button>
</div>

<div class="bottom">
  <div class="camera-controls">
    <button class="flip-button" id="flipButton" aria-label="Switch camera">↻</button>

    <div class="mode-selector" id="modeSelector">
      <div class="mode-names">
        <div class="mode-name" data-mode="slow">SLOW-MO</div>
        <div class="mode-name active" data-mode="photo">PHOTO</div>
        <div class="mode-name" data-mode="video">VIDEO</div>
      </div>

      <div class="shutter-row">
        <button id="shutter" aria-label="Capture">
          <span class="inner"></span>
        </button>
      </div>
    </div>
  </div>

  <div class="instruction" id="instruction">
    SWIPE TO CHANGE MODE · TAP TO CAPTURE
  </div>
  <div class="tagline">YOUR MOMENT. REWOUND.</div>
</div>

<div id="statusMessage"></div>

<div id="startScreen">
  <img class="start-logo" src="680A3BE0-D839-47C8-8C90-0FE9BD1F2173.png" alt="REWIND">
  <p>A different way to capture the moment. Allow camera access to begin.</p>
  <button id="startButton">OPEN CAMERA</button>
  <div id="errorMessage"></div>
</div>

<script>
"use strict";

const video=document.getElementById("cameraVideo");
const canvas=document.getElementById("cameraCanvas");
const gl=canvas.getContext("webgl",{
  alpha:false,
  antialias:true,
  preserveDrawingBuffer:true
});

const shutter=document.getElementById("shutter");
const startScreen=document.getElementById("startScreen");
const startButton=document.getElementById("startButton");
const errorMessage=document.getElementById("errorMessage");
const statusMessage=document.getElementById("statusMessage");
const recordingLabel=document.getElementById("recordingLabel");
const recordingTime=document.getElementById("recordingTime");
const instruction=document.getElementById("instruction");

let cameraStream=null;
let facingMode="environment";
let cameraReady=false;
let recorder=null;
let recordedChunks=[];
let recording=false;
let recordingStartedAt=0;
let recordingClock=null;
let lensShape=0;
let animationFrame=null;
let texture=null;
let program=null;
let statusTimeout=null;
let currentMode="photo";
let slowProcessing=false;
let slowSourceUrl=null;

const vertexShaderSource=`
attribute vec2 position;
varying vec2 vUv;
void main(){
  vUv=position*.5+.5;
  gl_Position=vec4(position,0.,1.);
}`;

const fragmentShaderSource=`
precision highp float;
varying vec2 vUv;
uniform sampler2D uVideo;
uniform vec2 uResolution;
uniform vec2 uVideoResolution;
uniform float uShape;
uniform float uTime;

void main(){

  vec2 p=(vUv-.5)*2.0;
  float aspect=uResolution.x/uResolution.y;
  p.x*=aspect;

  float radiusX=aspect*.94;
  float radiusY=radiusX;

  vec2 lens=vec2(p.x/radiusX,p.y/radiusY);
  float angle=atan(lens.y,lens.x);
  float rawRadius=length(lens);

  float edgeDistortion=
      sin(angle*5.0+.4)*.004
    + sin(angle*9.0+1.2)*.0025
    + sin(angle*13.0+2.1)*.0012;

  float edgeRadius=1.0+edgeDistortion;
  float r=rawRadius/edgeRadius;

  if(uShape<.5 && r>1.0){
    gl_FragColor=vec4(0.,0.,0.,1.);
    return;
  }

  float mapped;

  if(uShape<.5){
    float edgeCurve=pow(r,4.0)*(1.0-r);
    mapped=r+.34*edgeCurve;
  }else{
    /* FULL FRAME FISHEYE:
       Preserve the whole frame while adding circular warping. */
    float strength=.16;
    float radial=length(p);
    float curve=pow(radial,3.0);
    mapped=radial*(1.0-strength*curve);
  }

  vec2 direction=rawRadius>.0001?lens/rawRadius:vec2(0.);
  vec2 warped;

  if(uShape<.5){
    warped=direction*mapped;
  }else{
    float radial=length(p);
    vec2 screenDirection=radial>.0001?p/radial:vec2(0.);
    warped=screenDirection*(radial*(1.0-.16*pow(radial,2.0)));
  }

  float videoAspect=uVideoResolution.x/uVideoResolution.y;
  vec2 uv=vec2(.5);

  if(videoAspect>aspect){
    uv.x+=warped.x*(aspect/videoAspect)*.5;
    uv.y+=warped.y*.5;
  }else{
    uv.x+=warped.x*.5;
    uv.y+=warped.y*(videoAspect/aspect)*.5;
  }

  uv=clamp(uv,vec2(.001),vec2(.999));

  float aberration=pow(min(r,1.0),3.0)*.006;
  vec2 offset=direction*aberration;

  float red=texture2D(uVideo,clamp(uv+offset,vec2(.001),vec2(.999))).r;
  float green=texture2D(uVideo,uv).g;
  float blue=texture2D(uVideo,clamp(uv-offset,vec2(.001),vec2(.999))).b;

  vec3 colour=vec3(red,green,blue);

  float centreGlow=1.0+.10*exp(-r*r*4.0);
  float edgeFalloff=1.0-.28*smoothstep(.25,1.0,r);
  float directionalLight=1.0-.09*smoothstep(-.4,1.0,lens.y);
  float vignette=1.0-.48*smoothstep(.62,1.0,r);

  colour*=centreGlow*edgeFalloff*directionalLight*vignette;

  colour.r*=1.035;
  colour.g*=1.005;
  colour.b*=.965;

  float grain=fract(sin(dot(gl_FragCoord.xy+uTime,vec2(12.9898,78.233)))*43758.5453);
  colour+=(grain-.5)*.025;

  if(uShape<.5){
    float redRing=exp(-pow((r-.974)/.0045,2.0));
    float greenRing=exp(-pow((r-.990)/.0045,2.0));
    colour.r+=redRing*.13;
    colour.g+=greenRing*.085;
    colour*=1.0-smoothstep(.994,1.0,r);
  }else{
    /* Faint red and green vertical optical lines. */
    float redLine=exp(-pow((vUv.x-.125)/.0018,2.0));
    float greenLine=exp(-pow((vUv.x-.135)/.0018,2.0));
    colour.r+=redLine*.10;
    colour.g+=greenLine*.07;
  }

  gl_FragColor=vec4(colour,1.0);
}`;

function createShader(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

function setupWebGL(){
  if(!gl) throw new Error("WebGL is unavailable.");

  const vs=createShader(gl.VERTEX_SHADER,vertexShaderSource);
  const fs=createShader(gl.FRAGMENT_SHADER,fragmentShaderSource);

  program=gl.createProgram();
  gl.attachShader(program,vs);
  gl.attachShader(program,fs);
  gl.linkProgram(program);

  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
    throw new Error(gl.getProgramInfoLog(program));
  }

  gl.useProgram(program);

  const buffer=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
    -1,-1,1,-1,-1,1,1,1
  ]),gl.STATIC_DRAW);

  const position=gl.getAttribLocation(program,"position");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

  texture=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
}

function resizeCanvas(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const width=Math.round(innerWidth*dpr);
  const height=Math.round(innerHeight*dpr);

  if(canvas.width!==width||canvas.height!==height){
    canvas.width=width;
    canvas.height=height;
  }

  if(gl) gl.viewport(0,0,canvas.width,canvas.height);
}

function render(now=0){
  if(!gl||!program) return;

  if(video.readyState>=video.HAVE_CURRENT_DATA){
    gl.useProgram(program);
    gl.bindTexture(gl.TEXTURE_2D,texture);

    try{
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
    }catch(e){}

    gl.uniform1i(gl.getUniformLocation(program,"uVideo"),0);
    gl.uniform2f(gl.getUniformLocation(program,"uResolution"),canvas.width,canvas.height);
    gl.uniform2f(gl.getUniformLocation(program,"uVideoResolution"),video.videoWidth||1,video.videoHeight||1);
    gl.uniform1f(gl.getUniformLocation(program,"uShape"),lensShape);
    gl.uniform1f(gl.getUniformLocation(program,"uTime"),now*.001);

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  animationFrame=requestAnimationFrame(render);
}

async function startCamera(){
  errorMessage.textContent="";
  startButton.textContent="OPENING CAMERA";

  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Open REWIND in Safari using its HTTPS address.");
    }

    if(cameraStream){
      cameraStream.getTracks().forEach(track=>track.stop());
    }

    cameraStream=await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:{
        facingMode:{ideal:facingMode},
        width:{ideal:1920},
        height:{ideal:1080},
        frameRate:{ideal:120,max:120}
      }
    });

    video.srcObject=cameraStream;
    video.removeAttribute("src");
    video.playbackRate=1;
    await video.play();

    cameraReady=true;

    if(!program) setupWebGL();

    startScreen.style.display="none";
    resizeCanvas();
    cancelAnimationFrame(animationFrame);
    animationFrame=requestAnimationFrame(render);

  }catch(error){
    console.error(error);
    errorMessage.textContent=error.message||"Unable to access the camera. Check camera permissions.";
    startButton.textContent="TRY AGAIN";
  }
}

startButton.addEventListener("click",startCamera);

document.getElementById("flipButton").addEventListener("click",async()=>{
  if(recording||slowProcessing){
    showStatus("FINISH RECORDING FIRST");
    return;
  }

  facingMode=facingMode==="environment"?"user":"environment";
  await startCamera();
});

function setLens(shape){
  lensShape=shape;
  document.getElementById("circleButton").classList.toggle("active",shape===0);
  document.getElementById("fullButton").classList.toggle("active",shape===1);
}

document.getElementById("circleButton").addEventListener("click",()=>setLens(0));
document.getElementById("fullButton").addEventListener("click",()=>setLens(1));

function setMode(mode){
  if(recording||slowProcessing){
    showStatus("FINISH RECORDING FIRST");
    return;
  }

  currentMode=mode;

  document.querySelectorAll(".mode-name").forEach(el=>{
    el.classList.toggle("active",el.dataset.mode===mode);
  });

  shutter.classList.remove("video-mode","slow-mode","recording");

  if(mode==="video"){
    shutter.classList.add("video-mode");
    instruction.textContent="TAP TO START · TAP AGAIN TO STOP";
  }else if(mode==="slow"){
    shutter.classList.add("slow-mode");
    instruction.textContent="4× SLOW MOTION · TAP TO RECORD";
  }else{
    instruction.textContent="TAP PHOTO · SWIPE TO CHANGE MODE";
  }
}

function showStatus(message){
  statusMessage.textContent=message;
  statusMessage.classList.add("show");
  clearTimeout(statusTimeout);
  statusTimeout=setTimeout(()=>statusMessage.classList.remove("show"),2600);
}

/* SWIPE MODE SELECTOR */
let swipeStartX=0;
let swipeStartY=0;
let swiping=false;

const modeSelector=document.getElementById("modeSelector");

modeSelector.addEventListener("touchstart",event=>{
  if(event.touches.length!==1) return;
  swipeStartX=event.touches[0].clientX;
  swipeStartY=event.touches[0].clientY;
  swiping=true;
},{passive:true});

modeSelector.addEventListener("touchend",event=>{
  if(!swiping) return;
  swiping=false;

  const dx=event.changedTouches[0].clientX-swipeStartX;
  const dy=event.changedTouches[0].clientY-swipeStartY;

  if(Math.abs(dx)<35||Math.abs(dx)<Math.abs(dy)) return;

  const modes=["slow","photo","video"];
  let index=modes.indexOf(currentMode);

  if(dx<0) index=Math.min(2,index+1);
  else index=Math.max(0,index-1);

  setMode(modes[index]);
},{passive:true});

/* FILE SAVING */
async function saveFile(blob,filename){
  const file=new File([blob],filename,{type:blob.type});

  if(navigator.share&&navigator.canShare?.({files:[file]})){
    try{
      await navigator.share({files:[file],title:"REWIND"});
      return;
    }catch(error){
      if(error.name==="AbortError") return;
    }
  }

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),15000);
}

function takePhoto(){
  if(!cameraReady||recording||slowProcessing) return;

  canvas.toBlob(async blob=>{
    if(!blob){
      showStatus("PHOTO COULD NOT BE SAVED");
      return;
    }

    await saveFile(blob,"REWIND-"+Date.now()+".jpg");
    showStatus("PHOTO CAPTURED");
  },"image/jpeg",.96);
}

function supportedMime(){
  const formats=[
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];
  return formats.find(type=>MediaRecorder.isTypeSupported(type))||"";
}

function updateRecordingClock(){
  if(!recording) return;

  const seconds=Math.floor((Date.now()-recordingStartedAt)/1000);
  recordingTime.textContent="REC "+
    String(Math.floor(seconds/60)).padStart(2,"0")+":"+
    String(seconds%60).padStart(2,"0");
}

function beginRecordingClock(){
  recordingStartedAt=Date.now();
  recordingLabel.classList.add("active");
  updateRecordingClock();
  recordingClock=setInterval(updateRecordingClock,250);
}

function endRecordingClock(){
  clearInterval(recordingClock);
  recordingLabel.classList.remove("active");
}

function startNormalVideo(){
  if(!cameraReady||recording) return;

  try{
    const stream=canvas.captureStream(30);
    cameraStream.getAudioTracks().forEach(track=>stream.addTrack(track));

    const mimeType=supportedMime();
    recorder=new MediaRecorder(stream,mimeType?{mimeType}:{});
    recordedChunks=[];

    recorder.ondataavailable=e=>{
      if(e.data?.size) recordedChunks.push(e.data);
    };

    recorder.onstop=async()=>{
      const type=recorder.mimeType||"video/webm";
      const ext=type.includes("mp4")?"mp4":"webm";
      const blob=new Blob(recordedChunks,{type});

      stream.getTracks().forEach(track=>track.stop());

      if(blob.size){
        await saveFile(blob,"REWIND-VIDEO-"+Date.now()+"."+ext);
        showStatus("VIDEO READY TO SAVE");
      }
      recordedChunks=[];
    };

    recorder.start(250);
    recording=true;
    shutter.classList.add("recording");
    beginRecordingClock();

  }catch(error){
    console.error(error);
    showStatus("COULD NOT START VIDEO");
  }
}

function stopNormalVideo(){
  if(!recording||!recorder) return;

  recording=false;
  endRecordingClock();
  shutter.classList.remove("recording");

  if(recorder.state!=="inactive") recorder.stop();
}

/* SLOW MOTION
   Capture the processed camera feed at the highest available
   frame rate, then replay it at one-quarter speed into a
   30fps output recording.
*/
async function startSlowMotion(){
  if(!cameraReady||recording||slowProcessing) return;

  if(!canvas.captureStream||!window.MediaRecorder){
    showStatus("SLOW MOTION NOT SUPPORTED");
    return;
  }

  try{
    const sourceStream=canvas.captureStream(60);
    const mimeType=supportedMime();

    const sourceRecorder=new MediaRecorder(
      sourceStream,
      mimeType?{mimeType}:{}
    );

    const sourceChunks=[];
    sourceRecorder.ondataavailable=e=>{
      if(e.data?.size) sourceChunks.push(e.data);
    };

    sourceRecorder.onstop=async()=>{
      sourceStream.getTracks().forEach(track=>track.stop());

      const sourceType=sourceRecorder.mimeType||"video/webm";
      const sourceBlob=new Blob(sourceChunks,{type:sourceType});

      if(!sourceBlob.size){
        recording=false;
        slowProcessing=false;
        resetShutter();
        showStatus("SLOW MOTION FAILED");
        return;
      }

      await processSlowMotion(sourceBlob);
    };

    sourceRecorder.start(250);
    recorder=sourceRecorder;
    recording=true;
    shutter.classList.add("recording");
    beginRecordingClock();

    showStatus("SLOW MOTION RECORDING");

  }catch(error){
    console.error(error);
    recording=false;
    resetShutter();
    showStatus("COULD NOT START SLOW MOTION");
  }
}

async function processSlowMotion(sourceBlob){
  slowProcessing=true;
  recording=false;
  endRecordingClock();

  shutter.classList.add("recording");
  instruction.textContent="PROCESSING 4× SLOW MOTION";

  showStatus("PROCESSING SLOW MOTION");

  const originalStream=cameraStream;
  const sourceType=sourceBlob.type||"video/webm";
  slowSourceUrl=URL.createObjectURL(
    new Blob([sourceBlob],{type:sourceType})
  );

  try{
    video.pause();
    video.srcObject=null;
    video.src=slowSourceUrl;
    video.loop=false;
    video.playbackRate=.25;
    video.muted=true;

    await new Promise((resolve,reject)=>{
      video.onloadedmetadata=resolve;
      video.onerror=reject;
      video.load();
    });

    await video.play();

    const outputStream=canvas.captureStream(30);
    const outputMime=supportedMime();

    const outputRecorder=new MediaRecorder(
      outputStream,
      outputMime?{mimeType:outputMime}:{}
    );

    const outputChunks=[];

    outputRecorder.ondataavailable=e=>{
      if(e.data?.size) outputChunks.push(e.data);
    };

    const finished=new Promise((resolve,reject)=>{
      outputRecorder.onstop=resolve;
      outputRecorder.onerror=reject;
    });

    outputRecorder.start(250);

    await new Promise(resolve=>{
      video.onended=resolve;
    });

    if(outputRecorder.state!=="inactive"){
      outputRecorder.stop();
    }

    await finished;

    outputStream.getTracks().forEach(track=>track.stop());

    const outputType=outputRecorder.mimeType||"video/webm";
    const extension=outputType.includes("mp4")?"mp4":"webm";
    const result=new Blob(outputChunks,{type:outputType});

    if(result.size){
      await saveFile(
        result,
        "REWIND-SLOWMO-4X-"+Date.now()+"."+extension
      );
      showStatus("4× SLOW MOTION READY");
    }else{
      showStatus("SLOW MOTION COULD NOT BE SAVED");
    }

  }catch(error){
    console.error(error);
    showStatus("SLOW MOTION PROCESSING FAILED");
  }finally{
    video.pause();
    video.removeAttribute("src");
    video.srcObject=originalStream;
    video.playbackRate=1;
    video.muted=true;

    try{ await video.play(); }catch(e){}

    if(slowSourceUrl){
      URL.revokeObjectURL(slowSourceUrl);
      slowSourceUrl=null;
    }

    slowProcessing=false;
    resetShutter();
  }
}

function stopSlowMotion(){
  if(!recording||!recorder) return;
  recording=false;
  endRecordingClock();

  if(recorder.state!=="inactive"){
    recorder.stop();
  }
}

function resetShutter(){
  shutter.classList.remove("recording");
  setMode(currentMode);
}

/* SHUTTER ACTION */
shutter.addEventListener("click",event=>{
  event.preventDefault();

  if(!cameraReady||slowProcessing) return;

  if(currentMode==="photo"){
    takePhoto();
    return;
  }

  if(currentMode==="video"){
    if(recording) stopNormalVideo();
    else startNormalVideo();
    return;
  }

  if(currentMode==="slow"){
    if(recording) stopSlowMotion();
    else startSlowMotion();
  }
});

window.addEventListener("resize",resizeCanvas);
window.addEventListener("orientationchange",()=>setTimeout(resizeCanvas,250));

window.addEventListener("pagehide",()=>{
  cancelAnimationFrame(animationFrame);
  clearInterval(recordingClock);

  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
  }
});

</script>
