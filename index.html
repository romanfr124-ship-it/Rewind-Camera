
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REWIND">

<title>REWIND</title>

<style>
:root {
  --black: #050505;
  --white: #fff;
  --red: #ed2424;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--black);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  touch-action: manipulation;
}

body {
  position: fixed;
  inset: 0;
}

/* LIVE CAMERA */

#cameraCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--black);
}

#cameraVideo {
  display: none;
}

/* LOGO */

.top {
  position: absolute;
  z-index: 5;
  top: calc(env(safe-area-inset-top) + 20px);
  left: 22px;
  right: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.logo {
  width: 49px;
  height: 42px;
  display: block;
  overflow: visible;
}

.logo path,
.logo polygon {
  fill: white;
}

.logo .underline {
  fill: none;
  stroke: white;
  stroke-width: 3;
  stroke-linecap: round;
}

/* RECORDING INDICATOR */

.recording-label {
  display: none;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

.recording-label.active {
  display: flex;
}

.recording-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: .25; }
}

/* LENS SHAPE CONTROLS */

.lens-controls {
  position: absolute;
  z-index: 5;
  top: calc(env(safe-area-inset-top) + 78px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.small-control {
  min-width: 65px;
  padding: 9px 14px;
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 30px;
  background: rgba(0,0,0,.4);
  color: rgba(255,255,255,.65);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.small-control.active {
  color: white;
  border-color: white;
  background: rgba(255,255,255,.12);
}

/* BOTTOM CONTROLS */

.bottom {
  position: absolute;
  z-index: 5;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom) + 24px);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}

.camera-controls {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
}

/* CAMERA SWITCH */

.flip-button {
  position: absolute;
  right: 34px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.35);
  background: rgba(0,0,0,.4);
  color: white;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* SHUTTER BUTTON */

#shutter {
  width: 78px;
  height: 78px;
  border: 3px solid white;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  touch-action: none;
  outline: none;
}

#shutter::before {
  content: "";
  position: absolute;
  inset: -8px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 50%;
}

#shutter .inner {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: white;
  transition: all .18s ease;
}

/* RED RECORDING CENTRE */

#shutter.recording .inner {
  width: 27px;
  height: 27px;
  border-radius: 7px;
  background: var(--red);
}

/* HOLD PROGRESS */

#shutter.holding::after {
  content: "";
  position: absolute;
  inset: -8px;
  border: 3px solid transparent;
  border-top-color: var(--red);
  border-right-color: var(--red);
  border-radius: 50%;
  animation: hold-progress 2s linear forwards;
}

@keyframes hold-progress {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* TEXT */

.instruction {
  margin-top: 22px;
  color: rgba(255,255,255,.65);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-align: center;
}

.tagline {
  margin-top: 12px;
  color: rgba(255,255,255,.35);
  font-size: 9px;
  letter-spacing: 3px;
  text-align: center;
}

/* START SCREEN */

#startScreen {
  position: absolute;
  z-index: 10;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--black);
  padding: 30px;
  text-align: center;
}

.start-logo {
  width: 85px;
  height: 70px;
  margin-bottom: 25px;
}

#startScreen p {
  max-width: 270px;
  color: #888;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: 1px;
  margin: 0 0 28px;
}

#startButton {
  border: 1px solid white;
  background: white;
  color: black;
  border-radius: 30px;
  padding: 15px 30px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}

#errorMessage {
  color: #e66;
  font-size: 11px;
  line-height: 1.5;
  max-width: 290px;
  margin-top: 20px;
}

/* STATUS */

#statusMessage {
  position: absolute;
  z-index: 8;
  bottom: calc(env(safe-area-inset-bottom) + 145px);
  left: 20px;
  right: 20px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: white;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}

#statusMessage.show {
  opacity: 1;
}

@media (max-height: 650px) {
  .bottom {
    bottom: calc(env(safe-area-inset-bottom) + 12px);
  }

  #shutter {
    width: 68px;
    height: 68px;
  }

  #shutter .inner {
    width: 52px;
    height: 52px;
  }

  .instruction {
    margin-top: 13px;
  }

  .tagline {
    margin-top: 7px;
  }

  .lens-controls {
    top: calc(env(safe-area-inset-top) + 65px);
  }
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay muted playsinline></video>
<canvas id="cameraCanvas"></canvas>

<!-- BUILT-IN REWIND LOGO -->

<svg class="logo"
     style="position:absolute;z-index:6;top:calc(env(safe-area-inset-top) + 20px);left:22px;"
     viewBox="0 0 100 85"
     xmlns="http://www.w3.org/2000/svg"
     aria-label="REWIND logo">

  <polygon points="43,9 18,30 43,51"/>
  <polygon points="78,9 53,30 78,51"/>

  <path class="underline"
        d="M12 65 Q48 79 88 61"/>
</svg>

<div class="top">
  <div></div>

  <div class="recording-label" id="recordingLabel">
    <span class="recording-dot"></span>
    <span id="recordingTime">REC 00:00</span>
  </div>
</div>

<!-- LENS OPTIONS -->

<div class="lens-controls">
  <button class="small-control active" id="circleButton">
    CIRCLE
  </button>

  <button class="small-control" id="ovalButton">
    OVAL
  </button>
</div>

<!-- SHUTTER -->

<div class="bottom">

  <div class="camera-controls">

    <button class="flip-button"
            id="flipButton"
            aria-label="Switch camera">
      ↻
    </button>

    <button id="shutter"
            aria-label="Take photo or record video">
      <span class="inner"></span>
    </button>

  </div>

  <div class="instruction" id="instruction">
    TAP PHOTO · HOLD 2 SECONDS TO RECORD
  </div>

  <div class="tagline">
    YOUR MOMENT. REWOUND.
  </div>

</div>

<div id="statusMessage"></div>

<!-- CAMERA START SCREEN -->

<div id="startScreen">

  <svg class="start-logo"
       viewBox="0 0 100 85"
       xmlns="http://www.w3.org/2000/svg">

    <polygon points="43,9 18,30 43,51" fill="white"/>
    <polygon points="78,9 53,30 78,51" fill="white"/>

    <path d="M12 65 Q48 79 88 61"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"/>
  </svg>

  <p>
    A different way to capture the moment.
    Allow camera access to begin.
  </p>

  <button id="startButton">OPEN CAMERA</button>

  <div id="errorMessage"></div>

</div>

<script>

/* ========================================
   REWIND CAMERA ENGINE
======================================== */

const video = document.getElementById("cameraVideo");
const canvas = document.getElementById("cameraCanvas");

const gl = canvas.getContext("webgl", {
  alpha: false,
  antialias: true,
  preserveDrawingBuffer: true
});

const shutter = document.getElementById("shutter");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const errorMessage = document.getElementById("errorMessage");
const statusMessage = document.getElementById("statusMessage");

const recordingLabel = document.getElementById("recordingLabel");
const recordingTime = document.getElementById("recordingTime");
const instruction = document.getElementById("instruction");

let cameraStream = null;
let facingMode = "environment";
let cameraReady = false;

let recorder = null;
let recordedChunks = [];
let recording = false;

let recordingStartedAt = 0;
let recordingClock = null;

let holdTimer = null;
let longPressTriggered = false;
let stopWhenReleased = false;

let lensShape = 0;

let animationFrame = null;
let texture = null;
let program = null;

/* ========================================
   SHADERS
======================================== */

const vertexShaderSource = `
attribute vec2 position;
varying vec2 vUv;

void main() {
  vUv = position * 0.5 + 0.5;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

const fragmentShaderSource = `
precision highp float;

varying vec2 vUv;

uniform sampler2D uVideo;
uniform vec2 uResolution;
uniform vec2 uVideoResolution;
uniform float uStrength;
uniform float uShape;

void main() {

  float aspect = uResolution.x / uResolution.y;

  vec2 p = (vUv - 0.5) * 2.0;
  p.x *= aspect;

  /*
    LENS SIZE

    0.82 = approximately 82% of screen width.
    The X and Y proportions compensate for the
    phone's portrait aspect ratio, keeping the
    circle genuinely circular.
  */

  float radiusY = 0.82;
  float radiusX = aspect * radiusY;

  // Oval mode is slightly shorter vertically.
  if (uShape > 0.5) {
    radiusY = 0.62;
  }

  vec2 lens = vec2(
    p.x / radiusX,
    p.y / radiusY
  );

  float distanceFromCentre = length(lens);

  // Smooth black lens boundary.
  float edge = 1.0 - smoothstep(
    0.985,
    1.0,
    distanceFromCentre
  );

  // Fisheye barrel distortion.
  float distortion =
    1.0 - uStrength *
    distanceFromCentre *
    distanceFromCentre *
    0.30;

  vec2 warped = lens * distortion;

  // Crop the camera feed to preserve its aspect ratio.
  float videoAspect =
    uVideoResolution.x / uVideoResolution.y;

  vec2 crop = vec2(1.0);

  if (videoAspect > aspect) {
    crop.x = aspect / videoAspect;
  } else {
    crop.y = videoAspect / aspect;
  }

  vec2 samplePoint =
    vec2(0.5) + warped * crop * 0.5;

  vec3 colour = texture2D(
    uVideo,
    samplePoint
  ).rgb;

  // Vintage edge shading.
  float vignette = smoothstep(
    1.0,
    0.35,
    distanceFromCentre
  );

  colour *= mix(0.70, 1.0, vignette);

  // Subtle vintage colour character.
  colour.r *= 1.035;
  colour.g *= 1.005;
  colour.b *= 0.965;

  // Subtle film grain.
  float grain = fract(
    sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))
    * 43758.5453
  );

  colour += (grain - 0.5) * 0.018;

  // One continuous camera image.
  gl_FragColor = vec4(
    mix(vec3(0.0), colour, edge),
    1.0
  );
}
`;

/* ========================================
   WEBGL SETUP
======================================== */

function createShader(type, source) {

  const shader = gl.createShader(type);

  gl.shaderSource(shader, source);
  gl.compileShader(shader);

  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    return null;
  }

  return shader;
}

function setupWebGL() {

  if (!gl) return false;

  const vertexShader = createShader(
    gl.VERTEX_SHADER,
    vertexShaderSource
  );

  const fragmentShader = createShader(
    gl.FRAGMENT_SHADER,
    fragmentShaderSource
  );

  if (!vertexShader || !fragmentShader) {
    return false;
  }

  program = gl.createProgram();

  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    return false;
  }

  gl.useProgram(program);

  const vertices = new Float32Array([
    -1, -1,
     1, -1,
    -1,  1,
     1,  1
  ]);

  const buffer = gl.createBuffer();

  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
  );

  const positionLocation =
    gl.getAttribLocation(program, "position");

  gl.enableVertexAttribArray(positionLocation);

  gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
  );

  texture = gl.createTexture();

  gl.bindTexture(gl.TEXTURE_2D, texture);

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_S,
    gl.CLAMP_TO_EDGE
  );

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_T,
    gl.CLAMP_TO_EDGE
  );

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MIN_FILTER,
    gl.LINEAR
  );

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MAG_FILTER,
    gl.LINEAR
  );

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  return true;
}

/* ========================================
   CANVAS RESIZING
======================================== */

function resizeCanvas() {

  const dpr = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width = Math.floor(
    window.innerWidth * dpr
  );

  canvas.height = Math.floor(
    window.innerHeight * dpr
  );

  if (gl) {
    gl.viewport(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();

/* ========================================
   LIVE CAMERA RENDERING
======================================== */

function render() {

  if (!gl || !program) return;

  if (video.readyState >= video.HAVE_CURRENT_DATA) {

    gl.useProgram(program);
    gl.bindTexture(gl.TEXTURE_2D, texture);

    try {

      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        video
      );

    } catch (error) {}

    gl.uniform2f(
      gl.getUniformLocation(program, "uResolution"),
      canvas.width,
      canvas.height
    );

    gl.uniform2f(
      gl.getUniformLocation(program, "uVideoResolution"),
      video.videoWidth || 1,
      video.videoHeight || 1
    );

    gl.uniform1f(
      gl.getUniformLocation(program, "uStrength"),
      0.78
    );

    gl.uniform1f(
      gl.getUniformLocation(program, "uShape"),
      lensShape
    );

    gl.drawArrays(
      gl.TRIANGLE_STRIP,
      0,
      4
    );
  }

  animationFrame = requestAnimationFrame(render);
}

/* ========================================
   START CAMERA
======================================== */

async function startCamera() {

  errorMessage.textContent = "";
  startButton.textContent = "OPENING CAMERA...";

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {
    errorMessage.textContent =
      "Camera access requires HTTPS. Open REWIND through Safari.";
    startButton.textContent = "TRY AGAIN";
    return;
  }

  try {

    if (cameraStream) {
      cameraStream.getTracks().forEach(
        track => track.stop()
      );
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,

      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = cameraStream;

    await video.play();

    cameraReady = true;

    if (!program) {

      const success = setupWebGL();

      if (!success) {
        throw new Error("WebGL setup failed");
      }
    }

    startScreen.style.display = "none";

    resizeCanvas();

    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
    }

    render();

  } catch (error) {

    console.error(error);

    let message = "Unable to access the camera.";

    if (error.name === "NotAllowedError") {
      message =
        "Camera permission denied. Allow camera access in your iPhone settings.";
    }

    if (error.name === "NotFoundError") {
      message = "No camera was found.";
    }

    if (error.name === "NotReadableError") {
      message = "The camera may already be in use.";
    }

    errorMessage.textContent = message;
    startButton.textContent = "TRY AGAIN";
  }
}

startButton.addEventListener("click", startCamera);

/* ========================================
   SWITCH CAMERA
======================================== */

document.getElementById("flipButton").addEventListener(
  "click",
  async () => {

    if (recording) {
      showStatus("STOP RECORDING FIRST");
      return;
    }

    facingMode =
      facingMode === "environment"
        ? "user"
        : "environment";

    await startCamera();
  }
);

/* ========================================
   CIRCLE / OVAL
======================================== */

const circleButton =
  document.getElementById("circleButton");

const ovalButton =
  document.getElementById("ovalButton");

circleButton.addEventListener("click", () => {

  lensShape = 0;

  circleButton.classList.add("active");
  ovalButton.classList.remove("active");
});

ovalButton.addEventListener("click", () => {

  lensShape = 1;

  ovalButton.classList.add("active");
  circleButton.classList.remove("active");
});

/* ========================================
   STATUS MESSAGES
======================================== */

let statusTimeout;

function showStatus(message) {

  statusMessage.textContent = message;
  statusMessage.classList.add("show");

  clearTimeout(statusTimeout);

  statusTimeout = setTimeout(() => {
    statusMessage.classList.remove("show");
  }, 2200);
}

/* ========================================
   TAKE PHOTO
======================================== */

async function takePhoto() {

  if (!cameraReady || recording) return;

  canvas.toBlob(async (blob) => {

    if (!blob) {
      showStatus("PHOTO COULD NOT BE SAVED");
      return;
    }

    const file = new File(
      [blob],
      "REWIND-" + Date.now() + ".jpg",
      { type: "image/jpeg" }
    );

    await saveFile(file);

    showStatus("PHOTO CAPTURED");

  }, "image/jpeg", 0.94);
}

/* ========================================
   SAVE PHOTO OR VIDEO
======================================== */

async function saveFile(file) {

  try {

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({
        files: [file],
        title: "REWIND"
      });

      return;
    }

  } catch (error) {

    if (error.name === "AbortError") {
      return;
    }

    console.warn(error);
  }

  const url = URL.createObjectURL(file);

  const link = document.createElement("a");

  link.href = url;
  link.download = file.name;

  document.body.appendChild(link);

  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 15000);
}

/* ========================================
   START VIDEO RECORDING
======================================== */

function startRecording() {

  if (!cameraReady || recording) return;

  if (
    !canvas.captureStream ||
    !window.MediaRecorder
  ) {
    showStatus("VIDEO RECORDING NOT SUPPORTED");
    return;
  }

  try {

    const stream = canvas.captureStream(30);

    const mimeTypes = [
      "video/mp4;codecs=avc1.42E01E",
      "video/mp4",
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm"
    ];

    let options = {};

    for (const type of mimeTypes) {

      if (
        MediaRecorder.isTypeSupported &&
        MediaRecorder.isTypeSupported(type)
      ) {
        options.mimeType = type;
        break;
      }
    }

    recorder = new MediaRecorder(stream, options);

    recordedChunks = [];

    recorder.ondataavailable = (event) => {

      if (event.data && event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    recorder.onstop = async () => {

      const mimeType =
        recorder.mimeType || "video/webm";

      const extension =
        mimeType.includes("mp4")
          ? "mp4"
          : "webm";

      const blob = new Blob(
        recordedChunks,
        { type: mimeType }
      );

      const file = new File(
        [blob],
        "REWIND-VIDEO-" + Date.now() + "." + extension,
        { type: mimeType }
      );

      stream.getTracks().forEach(
        track => track.stop()
      );

      if (blob.size > 0) {

        await saveFile(file);

        showStatus("VIDEO READY TO SAVE");

      } else {

        showStatus("VIDEO COULD NOT BE SAVED");
      }

      recordedChunks = [];
    };

    recorder.start(1000);

    recording = true;
    recordingStartedAt = Date.now();

    shutter.classList.add("recording");
    recordingLabel.classList.add("active");

    instruction.textContent =
      "TAP AGAIN TO STOP RECORDING";

    updateRecordingClock();

    recordingClock = setInterval(
      updateRecordingClock,
      250
    );

  } catch (error) {

    console.error(error);

    recording = false;

    showStatus("COULD NOT START RECORDING");
  }
}

/* ========================================
   STOP VIDEO RECORDING
======================================== */

function stopRecording() {

  if (!recording || !recorder) return;

  recording = false;

  clearInterval(recordingClock);

  shutter.classList.remove("recording");
  recordingLabel.classList.remove("active");

  instruction.textContent =
    "TAP PHOTO · HOLD 2 SECONDS TO RECORD";

  if (recorder.state !== "inactive") {
    recorder.stop();
  }
}

/* ========================================
   RECORDING TIMER
======================================== */

function updateRecordingClock() {

  if (!recording) return;

  const seconds = Math.floor(
    (Date.now() - recordingStartedAt) / 1000
  );

  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = seconds % 60;

  recordingTime.textContent =
    "REC " +
    String(minutes).padStart(2, "0") +
    ":" +
    String(remainingSeconds).padStart(2, "0");
}

/* ========================================
   SHUTTER BUTTON
======================================== */

// Quick tap: photo.
// Hold for two seconds: begin video.
// Release: continue recording.
// Next tap: stop video.

function shutterDown(event) {

  event.preventDefault();

  if (!cameraReady) return;

  try {
    shutter.setPointerCapture(event.pointerId);
  } catch (error) {}

  if (recording) {

    stopWhenReleased = true;
    return;
  }

  stopWhenReleased = false;
  longPressTriggered = false;

  shutter.classList.add("holding");

  holdTimer = setTimeout(() => {

    longPressTriggered = true;

    shutter.classList.remove("holding");

    startRecording();

  }, 2000);
}

function shutterUp(event) {

  event.preventDefault();

  if (stopWhenReleased) {

    stopWhenReleased = false;

    stopRecording();

    return;
  }

  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }

  shutter.classList.remove("holding");

  if (!longPressTriggered && !recording) {
    takePhoto();
  }
}

function shutterCancel() {

  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }

  shutter.classList.remove("holding");

  stopWhenReleased = false;
}

shutter.addEventListener("pointerdown", shutterDown);
shutter.addEventListener("pointerup", shutterUp);
shutter.addEventListener("pointercancel", shutterCancel);

shutter.addEventListener("contextmenu", event => {
  event.preventDefault();
});

/* ========================================
   CLEANUP
======================================== */

window.addEventListener("pagehide", () => {

  if (holdTimer) {
    clearTimeout(holdTimer);
  }

  if (recordingClock) {
    clearInterval(recordingClock);
  }

  if (cameraStream) {
    cameraStream.getTracks().forEach(
      track => track.stop()
    );
  }
});

</script>
