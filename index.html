<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REWIND">

<title>REWIND</title>

<style>
:root {
  --white: #f5f5f5;
  --muted: #858585;
  --red: #ed2424;
  --black: #050505;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--black);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

body {
  position: fixed;
  inset: 0;
}

/* CAMERA */

#cameraCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #050505;
}

#cameraVideo {
  display: none;
}

/* TOP AREA */

.top {
  position: absolute;
  z-index: 5;
  top: calc(env(safe-area-inset-top) + 18px);
  left: 22px;
  right: 22px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  pointer-events: none;
}

.logo-wrap {
  display: flex;
  align-items: center;
  min-height: 42px;
}

.logo {
  display: block;
  width: 126px;
  max-height: 55px;
  object-fit: contain;
  object-position: left center;
}

.logo-fallback {
  display: none;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 3px;
  color: white;
}

.recording-label {
  display: none;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  padding-top: 11px;
}

.recording-label.active {
  display: flex;
}

.recording-dot {
  width: 7px;
  height: 7px;
  background: var(--red);
  border-radius: 50%;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0.25; }
}

/* LENS CONTROLS */

.lens-controls {
  position: absolute;
  z-index: 5;
  top: calc(env(safe-area-inset-top) + 82px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.small-control {
  min-width: 65px;
  padding: 9px 15px;
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 30px;
  background: rgba(0,0,0,0.35);
  color: rgba(255,255,255,0.65);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.small-control.active {
  color: white;
  border-color: white;
  background: rgba(255,255,255,0.12);
}

/* BOTTOM AREA */

.bottom {
  position: absolute;
  z-index: 5;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom) + 24px);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}

.camera-controls {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  pointer-events: auto;
}

.flip-button {
  position: absolute;
  right: 34px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.35);
  background: rgba(0,0,0,0.35);
  color: white;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* SHUTTER */

#shutter {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 3px solid white;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  touch-action: none;
  outline: none;
}

#shutter::before {
  content: "";
  position: absolute;
  inset: -8px;
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 50%;
}

#shutter .inner {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: white;
  transition: all 0.18s ease;
}

/* Recording state: red centre */

#shutter.recording .inner {
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: var(--red);
}

/* Hold progress */

#shutter.holding::after {
  content: "";
  position: absolute;
  inset: -8px;
  border: 3px solid transparent;
  border-top-color: var(--red);
  border-right-color: var(--red);
  border-radius: 50%;
  animation: hold-progress 2s linear forwards;
}

@keyframes hold-progress {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.instruction {
  margin-top: 23px;
  color: rgba(255,255,255,0.65);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2.4px;
  text-align: center;
  text-transform: uppercase;
}

.tagline {
  margin-top: 12px;
  color: rgba(255,255,255,0.35);
  font-size: 9px;
  letter-spacing: 3px;
  text-align: center;
}

/* CAMERA START SCREEN */

#startScreen {
  position: absolute;
  z-index: 10;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #050505;
  padding: 30px;
  text-align: center;
}

.start-logo {
  width: 190px;
  max-height: 90px;
  object-fit: contain;
  margin-bottom: 28px;
}

.start-fallback {
  display: none;
  font-size: 35px;
  font-weight: 900;
  letter-spacing: 5px;
  margin-bottom: 28px;
}

#startScreen p {
  max-width: 270px;
  color: #888;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: 1px;
  margin: 0 0 28px;
}

#startButton {
  border: 1px solid white;
  background: white;
  color: black;
  border-radius: 30px;
  padding: 15px 30px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  cursor: pointer;
}

#errorMessage {
  color: #e66;
  font-size: 11px;
  line-height: 1.5;
  max-width: 290px;
  margin-top: 20px;
}

/* SMALL STATUS MESSAGE */

#statusMessage {
  position: absolute;
  z-index: 8;
  bottom: calc(env(safe-area-inset-bottom) + 150px);
  left: 20px;
  right: 20px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: white;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

#statusMessage.show {
  opacity: 1;
}

@media (max-height: 650px) {
  .bottom {
    bottom: calc(env(safe-area-inset-bottom) + 12px);
  }

  #shutter {
    width: 68px;
    height: 68px;
  }

  #shutter .inner {
    width: 52px;
    height: 52px;
  }

  .instruction {
    margin-top: 13px;
  }

  .tagline {
    margin-top: 7px;
  }

  .lens-controls {
    top: calc(env(safe-area-inset-top) + 65px);
  }
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay muted playsinline></video>
<canvas id="cameraCanvas"></canvas>

<div class="top">
  <div class="logo-wrap">
    <img
      class="logo"
      src="./rewind-logo.png"
      alt="REWIND"
      onerror="this.style.display='none';document.querySelector('.logo-fallback').style.display='block';"
    >
    <div class="logo-fallback">REWIND</div>
  </div>

  <div class="recording-label" id="recordingLabel">
    <span class="recording-dot"></span>
    <span id="recordingTime">REC 00:00</span>
  </div>
</div>

<div class="lens-controls">
  <button class="small-control active" id="circleButton">CIRCLE</button>
  <button class="small-control" id="ovalButton">OVAL</button>
</div>

<div class="bottom">
  <div class="camera-controls">

    <button class="flip-button" id="flipButton" aria-label="Switch camera">
      ↻
    </button>

    <button id="shutter" aria-label="Take photo or record video">
      <span class="inner"></span>
    </button>

  </div>

  <div class="instruction" id="instruction">
    TAP PHOTO · HOLD 2 SECONDS TO RECORD
  </div>

  <div class="tagline">
    YOUR MOMENT. REWOUND.
  </div>
</div>

<div id="statusMessage"></div>

<div id="startScreen">
  <img
    class="start-logo"
    src="./rewind-logo.png"
    alt="REWIND"
    onerror="this.style.display='none';document.querySelector('.start-fallback').style.display='block';"
  >

  <div class="start-fallback">REWIND</div>

  <p>
    A different way to capture the moment.
    Allow camera access to begin.
  </p>

  <button id="startButton">OPEN CAMERA</button>
  <div id="errorMessage"></div>
</div>

<script>
/* ==========================================
   REWIND CAMERA
   ========================================== */

const video = document.getElementById("cameraVideo");
const canvas = document.getElementById("cameraCanvas");
const gl = canvas.getContext("webgl", {
  alpha: false,
  antialias: true,
  preserveDrawingBuffer: true
});

const shutter = document.getElementById("shutter");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const errorMessage = document.getElementById("errorMessage");
const statusMessage = document.getElementById("statusMessage");
const recordingLabel = document.getElementById("recordingLabel");
const recordingTime = document.getElementById("recordingTime");
const instruction = document.getElementById("instruction");

let cameraStream = null;
let facingMode = "environment";
let cameraReady = false;

let recorder = null;
let recordedChunks = [];
let recording = false;
let recordingStartedAt = 0;
let recordingClock = null;

let holdTimer = null;
let longPressTriggered = false;
let stopWhenReleased = false;

let lensShape = 0; // 0 = circle, 1 = oval
let fisheyeStrength = 0.78;

let animationFrame = null;
let texture = null;
let program = null;

/* ==========================================
   WEBGL SHADERS
   ========================================== */

if (!gl) {
  errorMessage.textContent =
    "This browser does not support the camera display. Please use Safari.";
}

const vertexShaderSource = `
attribute vec2 position;
varying vec2 vUv;

void main() {
  vUv = position * 0.5 + 0.5;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

const fragmentShaderSource = `
precision highp float;

varying vec2 vUv;

uniform sampler2D uVideo;
uniform vec2 uResolution;
uniform float uStrength;
uniform float uShape;

void main() {

  float aspect = uResolution.x / uResolution.y;

  vec2 p = (vUv - 0.5) * 2.0;
  p.x *= aspect;

  // The lens is deliberately kept smaller
  // so it fits comfortably on a phone.

  float radiusX = min(aspect * 0.42, 0.42);
  float radiusY = radiusX;

  // Oval mode is slightly shorter vertically.
  if (uShape > 0.5) {
    radiusY = radiusX * 0.72;
  }

  vec2 lens = vec2(
    p.x / radiusX,
    p.y / radiusY
  );

  float radius = length(lens);

  // Outside the lens is black.
  if (radius > 1.0) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
    return;
  }

  // Fisheye barrel distortion.
  float distortion =
    1.0 - uStrength * radius * radius * 0.30;

  vec2 warped = lens * distortion;

  vec2 samplePoint = vec2(
    0.5 + warped.x * radiusX / aspect,
    0.5 + warped.y * radiusY
  );

  vec3 colour = texture2D(uVideo, samplePoint).rgb;

  // Subtle darkening around the edge.
  float vignette = smoothstep(1.0, 0.45, radius);
  colour *= mix(0.68, 1.0, vignette);

  // Slight vintage colour character.
  colour.r *= 1.035;
  colour.b *= 0.965;

  gl_FragColor = vec4(colour, 1.0);
}
`;

/* ==========================================
   WEBGL SETUP
   ========================================== */

function createShader(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);

  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    return null;
  }

  return shader;
}

function setupWebGL() {
  if (!gl) return false;

  const vertexShader = createShader(
    gl.VERTEX_SHADER,
    vertexShaderSource
  );

  const fragmentShader = createShader(
    gl.FRAGMENT_SHADER,
    fragmentShaderSource
  );

  if (!vertexShader || !fragmentShader) return false;

  program = gl.createProgram();

  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    return false;
  }

  gl.useProgram(program);

  const vertices = new Float32Array([
    -1, -1,
     1, -1,
    -1,  1,
     1,  1
  ]);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

  const positionLocation =
    gl.getAttribLocation(program, "position");

  gl.enableVertexAttribArray(positionLocation);

  gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
  );

  texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_S,
    gl.CLAMP_TO_EDGE
  );

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_WRAP_T,
    gl.CLAMP_TO_EDGE
  );

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MIN_FILTER,
    gl.LINEAR
  );

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_MAG_FILTER,
    gl.LINEAR
  );

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  return true;
}

/* ==========================================
   CANVAS SIZE
   ========================================== */

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);

  if (gl) {
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ==========================================
   LIVE CAMERA RENDERING
   ========================================== */

function render() {
  if (!gl || !program) return;

  if (video.readyState >= video.HAVE_CURRENT_DATA) {

    gl.useProgram(program);
    gl.bindTexture(gl.TEXTURE_2D, texture);

    try {
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        video
      );
    } catch (error) {
      // Wait for the next frame if the video
      // is not ready to be uploaded yet.
    }

    gl.uniform2f(
      gl.getUniformLocation(program, "uResolution"),
      canvas.width,
      canvas.height
    );

    gl.uniform1f(
      gl.getUniformLocation(program, "uStrength"),
      fisheyeStrength
    );

    gl.uniform1f(
      gl.getUniformLocation(program, "uShape"),
      lensShape
    );

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  animationFrame = requestAnimationFrame(render);
}

/* ==========================================
   START CAMERA
   ========================================== */

async function startCamera() {
  errorMessage.textContent = "";
  startButton.textContent = "OPENING CAMERA...";

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    errorMessage.textContent =
      "Camera access requires HTTPS. Open REWIND through its GitHub Pages address in Safari.";
    startButton.textContent = "TRY AGAIN";
    return;
  }

  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    video.srcObject = cameraStream;

    await video.play();

    cameraReady = true;
    startScreen.style.display = "none";

    if (!program) {
      const success = setupWebGL();

      if (!success) {
        errorMessage.textContent =
          "The camera effect could not start. Please reload the page.";
        startScreen.style.display = "flex";
        return;
      }
    }

    resizeCanvas();

    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
    }

    render();

  } catch (error) {
    console.error(error);

    let message = "Unable to access the camera.";

    if (error.name === "NotAllowedError") {
      message =
        "Camera permission was denied. Allow camera access for REWIND in your iPhone settings.";
    } else if (error.name === "NotFoundError") {
      message = "No camera was found on this device.";
    } else if (error.name === "NotReadableError") {
      message = "The camera may already be in use by another app.";
    }

    errorMessage.textContent = message;
    startButton.textContent = "TRY AGAIN";
  }
}

startButton.addEventListener("click", startCamera);

/* ==========================================
   CAMERA FLIP
   ========================================== */

document.getElementById("flipButton").addEventListener("click", async () => {
  if (recording) {
    showStatus("STOP RECORDING BEFORE SWITCHING CAMERA");
    return;
  }

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  await startCamera();
});

/* ==========================================
   CIRCLE / OVAL
   ========================================== */

const circleButton = document.getElementById("circleButton");
const ovalButton = document.getElementById("ovalButton");

circleButton.addEventListener("click", () => {
  lensShape = 0;

  circleButton.classList.add("active");
  ovalButton.classList.remove("active");
});

ovalButton.addEventListener("click", () => {
  lensShape = 1;

  ovalButton.classList.add("active");
  circleButton.classList.remove("active");
});

/* ==========================================
   STATUS MESSAGE
   ========================================== */

let statusTimeout = null;

function showStatus(message) {
  statusMessage.textContent = message;
  statusMessage.classList.add("show");

  clearTimeout(statusTimeout);

  statusTimeout = setTimeout(() => {
    statusMessage.classList.remove("show");
  }, 2200);
}

/* ==========================================
   SAVE PHOTO
   ========================================== */

async function takePhoto() {
  if (!cameraReady || recording) return;

  try {
    showStatus("CAPTURING PHOTO");

    canvas.toBlob(async (blob) => {
      if (!blob) {
        showStatus("PHOTO COULD NOT BE SAVED");
        return;
      }

      const file = new File(
        [blob],
        "REWIND-" + Date.now() + ".jpg",
        { type: "image/jpeg" }
      );

      await saveFile(file);

      showStatus("PHOTO CAPTURED");

    }, "image/jpeg", 0.94);

  } catch (error) {
    console.error(error);
    showStatus("PHOTO COULD NOT BE SAVED");
  }
}

/* ==========================================
   SAVE PHOTO OR VIDEO
   ========================================== */

async function saveFile(file) {
  try {
    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      await navigator.share({
        files: [file],
        title: "REWIND"
      });

      return;
    }
  } catch (error) {
    if (error.name === "AbortError") return;
    console.warn("Share unavailable:", error);
  }

  const url = URL.createObjectURL(file);
  const link = document.createElement("a");

  link.href = url;
  link.download = file.name;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

/* ==========================================
   VIDEO RECORDING
   ========================================== */

function startRecording() {
  if (!cameraReady || recording) return;

  if (!canvas.captureStream || !window.MediaRecorder) {
    showStatus("VIDEO RECORDING IS NOT SUPPORTED IN THIS BROWSER");
    return;
  }

  try {
    const stream = canvas.captureStream(30);

    const mimeTypes = [
      "video/mp4;codecs=avc1.42E01E",
      "video/mp4",
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm"
    ];

    let options = {};

    for (const type of mimeTypes) {
      if (MediaRecorder.isTypeSupported &&
          MediaRecorder.isTypeSupported(type)) {
        options.mimeType = type;
        break;
      }
    }

    recorder = new MediaRecorder(stream, options);
    recordedChunks = [];

    recorder.ondataavailable = (event) => {
      if (event.data && event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    recorder.onstop = async () => {
      const mimeType =
        recorder.mimeType || "video/webm";

      const extension =
        mimeType.includes("mp4") ? "mp4" : "webm";

      const blob = new Blob(recordedChunks, {
        type: mimeType
      });

      const file = new File(
        [blob],
        "REWIND-VIDEO-" + Date.now() + "." + extension,
        { type: mimeType }
      );

      stream.getTracks().forEach(track => track.stop());

      if (blob.size > 0) {
        await saveFile(file);
        showStatus("VIDEO READY TO SAVE");
      } else {
        showStatus("VIDEO COULD NOT BE SAVED");
      }

      recordedChunks = [];
    };

    recorder.start(1000);

    recording = true;
    recordingStartedAt = Date.now();

    shutter.classList.add("recording");
    recordingLabel.classList.add("active");

    instruction.textContent = "TAP AGAIN TO STOP RECORDING";

    updateRecordingClock();

    recordingClock = setInterval(
      updateRecordingClock,
      250
    );

  } catch (error) {
    console.error(error);
    recording = false;
    showStatus("COULD NOT START VIDEO RECORDING");
  }
}

function stopRecording() {
  if (!recording || !recorder) return;

  recording = false;

  clearInterval(recordingClock);

  shutter.classList.remove("recording");
  recordingLabel.classList.remove("active");

  instruction.textContent =
    "TAP PHOTO · HOLD 2 SECONDS TO RECORD";

  if (recorder.state !== "inactive") {
    recorder.stop();
  }
}

function updateRecordingClock() {
  if (!recording) return;

  const seconds = Math.floor(
    (Date.now() - recordingStartedAt) / 1000
  );

  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = seconds % 60;

  recordingTime.textContent =
    "REC " +
    String(minutes).padStart(2, "0") +
    ":" +
    String(remainingSeconds).padStart(2, "0");
}

/* ==========================================
   SHUTTER INTERACTION
   ========================================== */

// Quick tap = photo.
// Hold for two seconds = start recording.
// Release after recording starts = keep recording.
// Next tap = stop recording.

function shutterDown(event) {
  event.preventDefault();

  if (!cameraReady) return;

  try {
    shutter.setPointerCapture(event.pointerId);
  } catch (error) {}

  if (recording) {
    stopWhenReleased = true;
    return;
  }

  stopWhenReleased = false;
  longPressTriggered = false;

  shutter.classList.add("holding");

  holdTimer = setTimeout(() => {
    longPressTriggered = true;
    shutter.classList.remove("holding");
    startRecording();
  }, 2000);
}

function shutterUp(event) {
  event.preventDefault();

  if (stopWhenReleased) {
    stopWhenReleased = false;
    stopRecording();
    return;
  }

  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }

  shutter.classList.remove("holding");

  if (!longPressTriggered && !recording) {
    takePhoto();
  }
}

function shutterCancel() {
  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }

  shutter.classList.remove("holding");
  stopWhenReleased = false;
}

shutter.addEventListener("pointerdown", shutterDown);
shutter.addEventListener("pointerup", shutterUp);
shutter.addEventListener("pointercancel", shutterCancel);

shutter.addEventListener("contextmenu", event => {
  event.preventDefault();
});

/* ==========================================
   CLEANUP
   ========================================== */

window.addEventListener("pagehide", () => {
  if (holdTimer) clearTimeout(holdTimer);
  if (recordingClock) clearInterval(recordingClock);

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
  }
});
</script>
