

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REWIND">
<title>REWIND</title>

<style>
:root {
  --black:#050505;
  --white:#fff;
  --red:#ed2424;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  touch-action:pan-y;
}

body {
  position:fixed;
  inset:0;
}

#cameraCanvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:var(--black);
}

#cameraVideo {
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

/* TOP LOGO */

.top {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 17px);
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
}

.logo {
  width:150px;
  height:auto;
  max-height:70px;
  object-fit:contain;
  transition:filter .25s ease;
}

.logo.full-frame {
  /* Original artwork is white on black: invert it, then screen away
     the white background so only black lettering and its white outline remain. */
  filter:
    invert(1)
    drop-shadow(1px 0 0 white)
    drop-shadow(-1px 0 0 white)
    drop-shadow(0 1px 0 white)
    drop-shadow(0 -1px 0 white);
  mix-blend-mode:screen;
}

/* RECORDING */

.recording-label {
  position:absolute;
  right:22px;
  display:none;
  align-items:center;
  gap:8px;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
}

.recording-label.active {
  display:flex;
}

.recording-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  animation:blink 1s infinite;
}

@keyframes blink {
  50% {opacity:.25;}
}

/* LENS SELECTOR */

.lens-controls {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 85px);
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
}

.small-control {
  min-width:100px;
  padding:12px 17px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:35px;
  background:rgba(0,0,0,.4);
  color:rgba(255,255,255,.6);
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.small-control.active {
  color:white;
  border-color:white;
  background:rgba(255,255,255,.12);
}

/* BOTTOM CAMERA SYSTEM */

.bottom {
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}

.camera-controls {
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:auto;
}

/* MODE SELECTOR */

.mode-selector {
  position:relative;
  width:min(290px, 88vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  touch-action:pan-y;
}

.mode-names {
  position:relative;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  overflow:visible;
}

.mode-name {
  flex:1;
  min-width:0;
  padding:9px 0;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.29);
  font-family:inherit;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-align:center;
  white-space:nowrap;
  opacity:.7;
  transform:scale(.78);
  transition:
    color .32s ease,
    opacity .32s ease,
    transform .38s cubic-bezier(.22,.8,.25,1),
    letter-spacing .32s ease;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

.mode-name.active {
  color:white;
  opacity:1;
  transform:scale(1.12);
  letter-spacing:2px;
}

/* ZOOM POPUP */

.zoom-panel {
  position:absolute;
  z-index:8;
  left:50%;
  bottom:calc(100% + 4px);
  transform:translate(-50%, 8px);
  width:min(260px, 78vw);
  padding:12px 15px 10px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:16px;
  background:rgba(8,8,8,.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease, visibility .2s;
}

.zoom-panel.open {
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translate(-50%, 0);
}

.zoom-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
  color:rgba(255,255,255,.65);
}

#zoomValue {
  color:white;
  font-size:12px;
  letter-spacing:1px;
}

#zoomSlider {
  width:100%;
  height:4px;
  margin:0;
  border-radius:10px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  background:rgba(255,255,255,.35);
  touch-action:pan-x;
}

#zoomSlider::-webkit-slider-thumb {
  appearance:none;
  -webkit-appearance:none;
  width:19px;
  height:19px;
  border-radius:50%;
  background:white;
  border:2px solid #777;
  box-shadow:0 0 0 4px rgba(255,255,255,.12);
}

#zoomSlider::-moz-range-thumb {
  width:16px;
  height:16px;
  border-radius:50%;
  background:white;
  border:2px solid #777;
}

/* SHUTTER AND ZOOM BUTTON */

.shutter-row {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

#shutter {
  width:78px;
  height:78px;
  border:3px solid white;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  touch-action:pan-y;
  outline:none;
  transition:border-color .2s, background .2s;
}

#shutter::before {
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
}

#shutter .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:white;
  transition:all .18s ease;
}

/* ZOOM BUTTON */

#zoomButton {
  position:absolute;
  left:calc(50% + 62px);
  top:50%;
  transform:translateY(-50%);
  min-width:65px;
  padding:11px 10px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:25px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:background .2s, border-color .2s;
}

#zoomButton.active {
  border-color:white;
  background:rgba(255,255,255,.15);
}

/* VIDEO */

#shutter.video-mode {
  border-color:var(--red);
}

#shutter.video-mode .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--red);
}

#shutter.video-mode.recording .inner {
  width:38px;
  height:38px;
  border-radius:7px;
}

/* SLOW MOTION */

#shutter.slow-mode {
  border-color:#d9d9d9;
}

#shutter.slow-mode .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:#d9d9d9;
}

#shutter.slow-mode.recording .inner {
  width:38px;
  height:38px;
  border-radius:7px;
  background:var(--red);
}

/* START SCREEN */

#startScreen {
  position:absolute;
  z-index:10;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:var(--black);
  padding:30px;
  text-align:center;
}

.start-logo {
  width:min(75vw,330px);
  height:auto;
  margin-bottom:35px;
}

#startScreen p {
  max-width:270px;
  color:#888;
  font-size:12px;
  line-height:1.7;
  letter-spacing:1px;
  margin:0 0 28px;
}

#startButton {
  border:1px solid white;
  background:white;
  color:black;
  border-radius:30px;
  padding:15px 30px;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

#errorMessage {
  color:#e66;
  font-size:11px;
  line-height:1.5;
  max-width:290px;
  margin-top:20px;
}

#statusMessage {
  position:absolute;
  z-index:8;
  bottom:calc(env(safe-area-inset-bottom) + 115px);
  left:20px;
  right:20px;
  text-align:center;
  font-size:10px;
  letter-spacing:1.5px;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

#statusMessage.show {
  opacity:1;
}

/* LANDSCAPE */

@media (orientation:landscape) {
  .top {
    top:calc(env(safe-area-inset-top) + 8px);
  }

  .logo {
    width:110px;
  }

  .lens-controls {
    top:calc(env(safe-area-inset-top) + 12px);
  }

  .bottom {
    bottom:calc(env(safe-area-inset-bottom) + 5px);
  }

  .mode-selector {
    width:270px;
    gap:10px;
  }

  #shutter {
    width:68px;
    height:68px;
  }

  #shutter .inner {
    width:52px;
    height:52px;
  }

  #shutter.video-mode .inner,
  #shutter.slow-mode .inner {
    width:52px;
    height:52px;
  }

  #shutter.video-mode.recording .inner,
  #shutter.slow-mode.recording .inner {
    width:34px;
    height:34px;
  }

  #zoomButton {
    left:calc(50% + 55px);
  }

  #statusMessage {
    bottom:calc(env(safe-area-inset-bottom) + 90px);
  }
}

@media (prefers-reduced-motion:reduce) {
  .mode-name,
  #shutter,
  #shutter .inner,
  .zoom-panel {
    transition:none;
  }
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay muted playsinline></video>
<canvas id="cameraCanvas"></canvas>

<header class="top">
  <img
    class="logo"
    id="mainLogo"
    src="IMG_1940.png"
    alt="REWIND"
  >

  <div class="recording-label" id="recordingLabel">
    <span class="recording-dot"></span>
    <span id="recordingTime">REC 00:00</span>
  </div>
</header>

<div class="lens-controls">
  <button class="small-control active" id="circleButton">CIRCLE</button>
  <button class="small-control" id="fullButton">FULL FRAME</button>
</div>

<div class="bottom">
  <div class="camera-controls">
    <div class="mode-selector" id="modeSelector">

      <div class="mode-names">

        <div class="zoom-panel" id="zoomPanel">
          <div class="zoom-heading">
            <span>ZOOM</span>
            <span id="zoomValue">1.0×</span>
          </div>
          <input
            id="zoomSlider"
            type="range"
            min="1"
            max="3"
            step="0.1"
            value="1"
          >
        </div>

        <button class="mode-name" data-mode="slow">SLOW-MO</button>
        <button class="mode-name active" data-mode="photo">PHOTO</button>
        <button class="mode-name" data-mode="video">VIDEO</button>
      </div>

      <div class="shutter-row">
        <button id="shutter" aria-label="Capture">
          <span class="inner"></span>
        </button>

        <button id="zoomButton" aria-label="Adjust zoom">1.0×</button>
      </div>

    </div>
  </div>
</div>

<div id="statusMessage"></div>

<div id="startScreen">
  <img
    class="start-logo"
    src="IMG_1940.png"
    alt="REWIND"
  >
  <p>A different way to capture the moment. Allow camera access to begin.</p>
  <button id="startButton">OPEN CAMERA</button>
  <div id="errorMessage"></div>
</div>

<script>
"use strict";

const video = document.getElementById("cameraVideo");
const canvas = document.getElementById("cameraCanvas");
const gl = canvas.getContext("webgl", {
  alpha:false,
  antialias:true,
  preserveDrawingBuffer:true
});

const shutter = document.getElementById("shutter");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const errorMessage = document.getElementById("errorMessage");
const statusMessage = document.getElementById("statusMessage");
const recordingLabel = document.getElementById("recordingLabel");
const recordingTime = document.getElementById("recordingTime");
const zoomButton = document.getElementById("zoomButton");
const zoomPanel = document.getElementById("zoomPanel");
const zoomSlider = document.getElementById("zoomSlider");
const zoomValue = document.getElementById("zoomValue");
const mainLogo = document.getElementById("mainLogo");

let cameraStream = null;
let cameraReady = false;
let recorder = null;
let recordedChunks = [];
let recording = false;
let recordingStartedAt = 0;
let recordingClock = null;
let lensShape = 0;
let animationFrame = null;
let texture = null;
let program = null;
let statusTimeout = null;
let currentMode = "photo";
let slowProcessing = false;
let slowSourceUrl = null;

let zoomLevel = 1;
let slowLensShape = 0;
let slowZoomLevel = 1;

/* SHADERS */

const vertexShaderSource = `
attribute vec2 position;
varying vec2 vUv;

void main(){
  vUv = position * .5 + .5;
  gl_Position = vec4(position,0.,1.);
}`;

const fragmentShaderSource = `
precision highp float;

varying vec2 vUv;

uniform sampler2D uVideo;
uniform vec2 uResolution;
uniform vec2 uVideoResolution;
uniform float uShape;
uniform float uTime;
uniform float uZoom;

void main(){

  vec2 p = (vUv - .5) * 2.0;

  float aspect = uResolution.x / uResolution.y;

  // Physical screen coordinates.
  p.x *= aspect;

  float radiusX = aspect * .94;
  float radiusY = radiusX;

  vec2 lens = vec2(p.x / radiusX, p.y / radiusY);

  float angle = atan(lens.y,lens.x);
  float rawRadius = length(lens);

  // Slight irregularity in the circular lens boundary.
  float edgeDistortion =
      sin(angle * 5.0 + .4) * .004
    + sin(angle * 9.0 + 1.2) * .0025
    + sin(angle * 13.0 + 2.1) * .0012;

  float edgeRadius = 1.0 + edgeDistortion;
  float r = rawRadius / edgeRadius;

  // Allow a small area outside the lens for the blue optical halo.
  if(uShape < .5 && r > 1.055){
    gl_FragColor = vec4(0.,0.,0.,1.);
    return;
  }

  // Render the soft blue halo outside the circular lens boundary.
  // This follows the same irregular edge as the lens itself.
  if(uShape < .5 && r > 1.0){
    float halo = 1.0 - smoothstep(1.0,1.055,r);
    float haloStrength = halo * .045;
    vec3 blueHalo = vec3(.015,.075,.30) * haloStrength;

    gl_FragColor = vec4(blueHalo,1.0);
    return;
  }

  float mapped;

  if(uShape < .5){

    // Circular fisheye warping.
    float edgeCurve = pow(r,4.0) * (1.0-r);
    mapped = r + .34 * edgeCurve;

  }else{

    // Full-frame fisheye warping.
    float radial = length(p);
    float strength = .16;
    float curve = pow(radial,3.0);
    mapped = radial * (1.0-strength*curve);
  }

  vec2 direction =
    rawRadius > .0001 ? lens / rawRadius : vec2(0.);

  vec2 warped;

  if(uShape < .5){

    warped = direction * mapped;

  }else{

    float radial = length(p);
    vec2 screenDirection =
      radial > .0001 ? p / radial : vec2(0.);

    warped = screenDirection *
      (radial * (1.0-.16*pow(radial,2.0)));
  }

  // Calculate the source image mapping while preserving aspect ratio.
  float videoAspect = uVideoResolution.x / uVideoResolution.y;

  vec2 uv = vec2(.5);

  if(videoAspect > aspect){
    uv.x += warped.x * (aspect/videoAspect) * .5;
    uv.y += warped.y * .5;
  }else{
    uv.x += warped.x * .5;
    uv.y += warped.y * (videoAspect/aspect) * .5;
  }

  // Zoom is applied to the source sampling, before optical effects.
  // This keeps the lens distortion active at every zoom level.
  uv = vec2(.5) + (uv - vec2(.5)) / uZoom;

  // Prevent edge smearing when the expanded image reaches its limits.
  if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0){
    gl_FragColor = vec4(0.,0.,0.,1.);
    return;
  }

  float aberration = pow(min(r,1.0),3.0) * .006;
  vec2 offset = direction * aberration;

  vec2 redUV = clamp(uv+offset,vec2(.001),vec2(.999));
  vec2 blueUV = clamp(uv-offset,vec2(.001),vec2(.999));

  float red = texture2D(uVideo,redUV).r;
  float green = texture2D(uVideo,uv).g;
  float blue = texture2D(uVideo,blueUV).b;

  vec3 colour = vec3(red,green,blue);

  float centreGlow = 1.0 + .10 * exp(-r*r*4.0);

  // Circle retains optical falloff and vignette.
  // Full Frame has no vignette.
  float circleFalloff =
      (1.0-.28*smoothstep(.25,1.0,r))
    * (1.0-.48*smoothstep(.62,1.0,r));

  float opticalFalloff = uShape < .5 ? circleFalloff : 1.0;

  float directionalLight =
    1.0 - .09 * smoothstep(-.4,1.0,lens.y);

  colour *= centreGlow * directionalLight * opticalFalloff;

  colour.r *= 1.035;
  colour.g *= 1.005;
  colour.b *= .965;

  // Film grain.
  float grain = fract(
    sin(dot(gl_FragCoord.xy+uTime,vec2(12.9898,78.233)))
    * 43758.5453
  );

  colour += (grain-.5) * .025;

  if(uShape < .5){

    float redRing = exp(-pow((r-.974)/.0045,2.0));
    float greenRing = exp(-pow((r-.990)/.0045,2.0));

    colour.r += redRing * .13;
    colour.g += greenRing * .085;

    colour *= 1.0-smoothstep(.994,1.0,r);

    // Subtle blue optical coating around the entire fisheye perimeter.
    // Applied after the edge fade so the blue tint remains visible.
    float blueEdge = exp(-pow((r-.978)/.022,2.0));
    float blueStrength = blueEdge * .065;

    colour = mix(
      colour,
      vec3(.035,.16,.48),
      blueStrength
    );

    colour.b += blueEdge*.025;

  }

  gl_FragColor = vec4(colour,1.0);
}`;

/* WEBGL SETUP */

function createShader(type,source){
  const shader = gl.createShader(type);

  gl.shaderSource(shader,source);
  gl.compileShader(shader);

  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(shader));
  }

  return shader;
}

function setupWebGL(){
  if(!gl) throw new Error("WebGL is unavailable.");

  const vs = createShader(gl.VERTEX_SHADER,vertexShaderSource);
  const fs = createShader(gl.FRAGMENT_SHADER,fragmentShaderSource);

  program = gl.createProgram();

  gl.attachShader(program,vs);
  gl.attachShader(program,fs);
  gl.linkProgram(program);

  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
    throw new Error(gl.getProgramInfoLog(program));
  }

  gl.useProgram(program);

  const buffer = gl.createBuffer();

  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);

  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([-1,-1,1,-1,-1,1,1,1]),
    gl.STATIC_DRAW
  );

  const position = gl.getAttribLocation(program,"position");

  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

  texture = gl.createTexture();

  gl.bindTexture(gl.TEXTURE_2D,texture);

  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
}

/* CANVAS */

function resizeCanvas(){
  const dpr = Math.min(devicePixelRatio||1,2);

  const width = Math.round(innerWidth*dpr);
  const height = Math.round(innerHeight*dpr);

  if(canvas.width!==width || canvas.height!==height){
    canvas.width = width;
    canvas.height = height;
  }

  if(gl){
    gl.viewport(0,0,canvas.width,canvas.height);
  }
}

/* RENDER LOOP */

function render(now=0){
  if(!gl || !program) return;

  if(video.readyState >= video.HAVE_CURRENT_DATA){

    gl.useProgram(program);
    gl.bindTexture(gl.TEXTURE_2D,texture);

    try{
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        video
      );
    }catch(e){}

    const activeShape = slowProcessing ? slowLensShape : lensShape;
    const activeZoom = slowProcessing ? slowZoomLevel : zoomLevel;

    gl.uniform1i(gl.getUniformLocation(program,"uVideo"),0);

    gl.uniform2f(
      gl.getUniformLocation(program,"uResolution"),
      canvas.width,
      canvas.height
    );

    gl.uniform2f(
      gl.getUniformLocation(program,"uVideoResolution"),
      video.videoWidth||1,
      video.videoHeight||1
    );

    gl.uniform1f(
      gl.getUniformLocation(program,"uShape"),
      activeShape
    );

    gl.uniform1f(
      gl.getUniformLocation(program,"uZoom"),
      activeZoom
    );

    gl.uniform1f(
      gl.getUniformLocation(program,"uTime"),
      now*.001
    );

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  animationFrame = requestAnimationFrame(render);
}

/* CAMERA */

async function startCamera(){
  errorMessage.textContent = "";
  startButton.textContent = "OPENING CAMERA";

  try{

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Open REWIND in Safari using its HTTPS address.");
    }

    if(cameraStream){
      cameraStream.getTracks().forEach(track=>track.stop());
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920},
        height:{ideal:1080},
        frameRate:{ideal:120,max:120}
      }
    });

    video.srcObject = cameraStream;
    video.removeAttribute("src");
    video.playbackRate = 1;

    await video.play();

    cameraReady = true;

    if(!program){
      setupWebGL();
    }

    startScreen.style.display = "none";

    resizeCanvas();

    cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(render);

  }catch(error){

    console.error(error);

    errorMessage.textContent =
      error.message || "Unable to access the camera. Check camera permissions.";

    startButton.textContent = "TRY AGAIN";
  }
}

startButton.addEventListener("click",startCamera);

/* LENS */

function setLens(shape){
  lensShape = shape;

  document.getElementById("circleButton")
    .classList.toggle("active",shape===0);

  document.getElementById("fullButton")
    .classList.toggle("active",shape===1);

  mainLogo.classList.toggle("full-frame",shape===1);

  // Circle mode cannot zoom below 1x.
  if(shape===0 && zoomLevel<1){
    zoomLevel = 1;
  }

  updateZoomInterface();
}

document.getElementById("circleButton")
  .addEventListener("click",()=>setLens(0));

document.getElementById("fullButton")
  .addEventListener("click",()=>setLens(1));

/* ZOOM */

function updateZoomInterface(){
  const minimum = lensShape===1 ? .5 : 1;

  zoomSlider.min = String(minimum);
  zoomSlider.max = "3";
  zoomSlider.value = String(zoomLevel);

  zoomValue.textContent = zoomLevel.toFixed(1)+"×";
  zoomButton.textContent = zoomLevel.toFixed(1)+"×";
}

zoomButton.addEventListener("click",event=>{
  event.stopPropagation();

  const isOpen = zoomPanel.classList.toggle("open");

  zoomButton.classList.toggle("active",isOpen);
});

zoomPanel.addEventListener("click",event=>{
  event.stopPropagation();
});

zoomSlider.addEventListener("input",()=>{
  zoomLevel = Number(zoomSlider.value);
  updateZoomInterface();
});

document.addEventListener("click",event=>{
  if(
    !zoomPanel.contains(event.target) &&
    !zoomButton.contains(event.target)
  ){
    zoomPanel.classList.remove("open");
    zoomButton.classList.remove("active");
  }
});

/* MODES */

function setMode(mode){
  if(recording || slowProcessing){
    showStatus("FINISH RECORDING FIRST");
    return;
  }

  currentMode = mode;

  document.querySelectorAll(".mode-name").forEach(el=>{
    el.classList.toggle("active",el.dataset.mode===mode);
  });

  shutter.classList.remove("video-mode","slow-mode","recording");

  if(mode==="video"){
    shutter.classList.add("video-mode");
  }else if(mode==="slow"){
    shutter.classList.add("slow-mode");
  }
}

document.querySelectorAll(".mode-name").forEach(button=>{
  button.addEventListener("click",()=>{
    setMode(button.dataset.mode);
  });
});

/* STATUS */

function showStatus(message){
  statusMessage.textContent = message;
  statusMessage.classList.add("show");

  clearTimeout(statusTimeout);

  statusTimeout = setTimeout(()=>{
    statusMessage.classList.remove("show");
  },2600);
}

/* SWIPE MODE SELECTOR */

let swipeStartX = 0;
let swipeStartY = 0;
let swiping = false;

const modeSelector = document.getElementById("modeSelector");

modeSelector.addEventListener("touchstart",event=>{
  if(event.touches.length!==1) return;

  swipeStartX = event.touches[0].clientX;
  swipeStartY = event.touches[0].clientY;
  swiping = true;
},{passive:true});

modeSelector.addEventListener("touchend",event=>{
  if(!swiping) return;

  swiping = false;

  const dx = event.changedTouches[0].clientX-swipeStartX;
  const dy = event.changedTouches[0].clientY-swipeStartY;

  if(Math.abs(dx)<35 || Math.abs(dx)<Math.abs(dy)) return;

  const modes = ["slow","photo","video"];
  let index = modes.indexOf(currentMode);

  if(dx<0) index = Math.min(2,index+1);
  else index = Math.max(0,index-1);

  setMode(modes[index]);
},{passive:true});

/* FILE SAVING */

async function saveFile(blob,filename){
  const file = new File([blob],filename,{type:blob.type});

  if(navigator.share && navigator.canShare?.({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:"REWIND"
      });

      return;

    }catch(error){
      if(error.name==="AbortError") return;
    }
  }

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),15000);
}

/* PHOTO */

function takePhoto(){
  if(!cameraReady || recording || slowProcessing) return;

  canvas.toBlob(async blob=>{
    if(!blob){
      showStatus("PHOTO COULD NOT BE SAVED");
      return;
    }

    await saveFile(blob,"REWIND-"+Date.now()+".jpg");

    showStatus("PHOTO CAPTURED");

  },"image/jpeg",.96);
}

/* VIDEO FORMAT */

function supportedMime(){
  const formats = [
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  return formats.find(type=>MediaRecorder.isTypeSupported(type)) || "";
}

/* RECORDING CLOCK */

function updateRecordingClock(){
  if(!recording) return;

  const seconds = Math.floor((Date.now()-recordingStartedAt)/1000);

  recordingTime.textContent = "REC "+
    String(Math.floor(seconds/60)).padStart(2,"0")+":"+
    String(seconds%60).padStart(2,"0");
}

function beginRecordingClock(){
  recordingStartedAt = Date.now();

  recordingLabel.classList.add("active");

  updateRecordingClock();

  recordingClock = setInterval(updateRecordingClock,250);
}

function endRecordingClock(){
  clearInterval(recordingClock);
  recordingLabel.classList.remove("active");
}

/* NORMAL VIDEO */

function startNormalVideo(){
  if(!cameraReady || recording) return;

  try{

    const stream = canvas.captureStream(30);

    cameraStream.getAudioTracks().forEach(track=>{
      stream.addTrack(track);
    });

    const mimeType = supportedMime();

    recorder = new MediaRecorder(
      stream,
      mimeType ? {mimeType} : {}
    );

    recordedChunks = [];

    recorder.ondataavailable = event=>{
      if(event.data?.size){
        recordedChunks.push(event.data);
      }
    };

    recorder.onstop = async()=>{
      const type = recorder.mimeType || "video/webm";
      const ext = type.includes("mp4") ? "mp4" : "webm";

      const blob = new Blob(recordedChunks,{type});

      stream.getTracks().forEach(track=>track.stop());

      if(blob.size){
        await saveFile(
          blob,
          "REWIND-VIDEO-"+Date.now()+"."+ext
        );

        showStatus("VIDEO READY TO SAVE");
      }

      recordedChunks = [];
    };

    recorder.start(250);

    recording = true;

    shutter.classList.add("recording");

    beginRecordingClock();

  }catch(error){

    console.error(error);
    showStatus("COULD NOT START VIDEO");
  }
}

function stopNormalVideo(){
  if(!recording || !recorder) return;

  recording = false;

  endRecordingClock();

  shutter.classList.remove("recording");

  if(recorder.state!=="inactive"){
    recorder.stop();
  }
}

/* SLOW MOTION RECORDING */

async function startSlowMotion(){
  if(!cameraReady || recording || slowProcessing) return;

  if(!canvas.captureStream || !window.MediaRecorder){
    showStatus("SLOW MOTION NOT SUPPORTED");
    return;
  }

  try{

    // Lock the lens and zoom settings for the entire recording.
    slowLensShape = lensShape;
    slowZoomLevel = zoomLevel;

    const sourceStream = canvas.captureStream(60);
    const mimeType = supportedMime();

    const sourceRecorder = new MediaRecorder(
      sourceStream,
      mimeType ? {mimeType} : {}
    );

    const sourceChunks = [];

    sourceRecorder.ondataavailable = event=>{
      if(event.data?.size){
        sourceChunks.push(event.data);
      }
    };

    sourceRecorder.onstop = async()=>{
      sourceStream.getTracks().forEach(track=>track.stop());

      const sourceType = sourceRecorder.mimeType || "video/webm";

      const sourceBlob = new Blob(sourceChunks,{type:sourceType});

      if(!sourceBlob.size){
        recording = false;
        slowProcessing = false;
        resetShutter();
        showStatus("SLOW MOTION FAILED");
        return;
      }

      await processSlowMotion(sourceBlob);
    };

    sourceRecorder.start(250);

    recorder = sourceRecorder;
    recording = true;

    shutter.classList.add("recording");

    beginRecordingClock();

    showStatus("SLOW MOTION RECORDING");

  }catch(error){

    console.error(error);

    recording = false;

    resetShutter();

    showStatus("COULD NOT START SLOW MOTION");
  }
}

/* SLOW MOTION EXPORT */

async function processSlowMotion(sourceBlob){
  slowProcessing = true;
  recording = false;

  endRecordingClock();

  shutter.classList.add("recording");

  const originalStream = cameraStream;

  slowSourceUrl = URL.createObjectURL(sourceBlob);

  let outputStream = null;
  let outputRecorder = null;
  let outputChunks = [];

  try{

    video.pause();
    video.srcObject = null;
    video.removeAttribute("src");

    video.loop = false;
    video.muted = true;
    video.playsInline = true;

    video.defaultPlaybackRate = .25;
    video.playbackRate = .25;

    await new Promise((resolve,reject)=>{

      const loaded = ()=>{
        cleanup();
        resolve();
      };

      const failed = ()=>{
        cleanup();
        reject(new Error("Could not load the recorded video."));
      };

      const cleanup = ()=>{
        video.removeEventListener("loadedmetadata",loaded);
        video.removeEventListener("error",failed);
      };

      video.addEventListener("loadedmetadata",loaded,{once:true});
      video.addEventListener("error",failed,{once:true});

      video.src = slowSourceUrl;
      video.load();
    });

    if(video.readyState<video.HAVE_CURRENT_DATA){

      await new Promise((resolve,reject)=>{

        const ready = ()=>{
          cleanup();
          resolve();
        };

        const failed = ()=>{
          cleanup();
          reject(new Error("Could not decode the slow-motion recording."));
        };

        const cleanup = ()=>{
          video.removeEventListener("loadeddata",ready);
          video.removeEventListener("error",failed);
        };

        video.addEventListener("loadeddata",ready,{once:true});
        video.addEventListener("error",failed,{once:true});
      });
    }

    video.defaultPlaybackRate = .25;
    video.playbackRate = .25;

    outputStream = canvas.captureStream(30);

    const outputMime = supportedMime();

    outputRecorder = new MediaRecorder(
      outputStream,
      outputMime ? {mimeType:outputMime} : {}
    );

    outputChunks = [];

    outputRecorder.ondataavailable = event=>{
      if(event.data?.size){
        outputChunks.push(event.data);
      }
    };

    const finished = new Promise((resolve,reject)=>{

      outputRecorder.addEventListener("stop",resolve,{once:true});

      outputRecorder.addEventListener("error",event=>{
        reject(event.error || new Error("Export recording failed."));
      },{once:true});
    });

    const playbackFinished = new Promise((resolve,reject)=>{

      const ended = ()=>{
        cleanup();
        resolve();
      };

      const failed = ()=>{
        cleanup();
        reject(new Error("Slow-motion playback failed."));
      };

      const cleanup = ()=>{
        video.removeEventListener("ended",ended);
        video.removeEventListener("error",failed);
      };

      video.addEventListener("ended",ended,{once:true});
      video.addEventListener("error",failed,{once:true});
    });

    outputRecorder.start(250);

    await new Promise(resolve=>{
      requestAnimationFrame(()=>{
        requestAnimationFrame(resolve);
      });
    });

    await video.play();

    video.playbackRate = .25;

    if(Math.abs(video.playbackRate-.25)>.01){
      throw new Error("This browser is not accepting 4x slow playback.");
    }

    await playbackFinished;

    if(outputRecorder.state!=="inactive"){
      outputRecorder.stop();
    }

    await finished;

    const outputType = outputRecorder.mimeType || "video/webm";
    const extension = outputType.includes("mp4") ? "mp4" : "webm";

    const result = new Blob(outputChunks,{type:outputType});

    if(result.size){

      await saveFile(
        result,
        "REWIND-SLOWMO-4X-"+Date.now()+"."+extension
      );

      showStatus("4× SLOW MOTION READY");

    }else{
      showStatus("SLOW MOTION COULD NOT BE SAVED");
    }

  }catch(error){

    console.error("Slow-motion export error:",error);

    showStatus(error.message || "SLOW MOTION PROCESSING FAILED");

    if(outputRecorder && outputRecorder.state!=="inactive"){
      try{
        outputRecorder.stop();
      }catch(e){}
    }

  }finally{

    if(outputStream){
      outputStream.getTracks().forEach(track=>track.stop());
    }

    // Restore the live camera.
    video.pause();
    video.removeAttribute("src");
    video.srcObject = originalStream;

    video.playbackRate = 1;
    video.defaultPlaybackRate = 1;
    video.muted = true;

    try{
      await video.play();
    }catch(error){
      console.error("Camera restore error:",error);
    }

    if(slowSourceUrl){
      URL.revokeObjectURL(slowSourceUrl);
      slowSourceUrl = null;
    }

    slowProcessing = false;

    resetShutter();
  }
}

function stopSlowMotion(){
  if(!recording || !recorder) return;

  recording = false;

  endRecordingClock();

  if(recorder.state!=="inactive"){
    recorder.stop();
  }
}

/* RESET */

function resetShutter(){
  shutter.classList.remove("recording");
  setMode(currentMode);
}

/* SHUTTER ACTION */

shutter.addEventListener("click",event=>{
  event.preventDefault();

  if(!cameraReady || slowProcessing) return;

  if(currentMode==="photo"){
    takePhoto();
    return;
  }

  if(currentMode==="video"){
    if(recording) stopNormalVideo();
    else startNormalVideo();

    return;
  }

  if(currentMode==="slow"){
    if(recording) stopSlowMotion();
    else startSlowMotion();
  }
});

/* RESIZE */

window.addEventListener("resize",resizeCanvas);

window.addEventListener("orientationchange",()=>{
  setTimeout(resizeCanvas,250);
});

/* CLEANUP */

window.addEventListener("pagehide",()=>{
  cancelAnimationFrame(animationFrame);

  clearInterval(recordingClock);

  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
  }
});

/* INITIAL SETTINGS */

updateZoomInterface();
setMode("photo");

</script>
