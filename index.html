
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>REWIND</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:28px 20px 16px;letter-spacing:8px;font-size:25px;font-weight:bold}
main{max-width:520px;margin:auto;padding:12px 20px}
#stage{position:relative;width:100%;aspect-ratio:3/4;background:#171717;overflow:hidden;border-radius:4px}
video,canvas{width:100%;height:100%;object-fit:cover}
video{display:block}
canvas{display:none}
#placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:12px;letter-spacing:3px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
button,select{background:#eee;color:#111;border:0;padding:13px 17px;font-size:12px;letter-spacing:1px;border-radius:2px}
button:disabled{opacity:.4}
#capture{width:72px;height:72px;border:5px solid white;border-radius:50%;background:transparent;padding:0}
label{display:block;color:#aaa;font-size:11px;letter-spacing:2px;margin:14px}
input{width:160px;accent-color:white}
#message{color:#aaa;font-size:12px;min-height:20px;margin:12px}
#result{width:100%;display:none;margin-top:14px}
footer{color:#555;font-size:10px;letter-spacing:3px;padding:24px}
</style>
</head>
<body>
<header>REWIND</header>
<main>
<div id="stage">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="placeholder">YOUR MOMENT. REWOUND.</div>
</div>
<div class="controls">
<button id="start">OPEN CAMERA</button>
<button id="flip">FLIP CAMERA</button>
</div>
<label>FISHEYE STRENGTH <span id="amount">65%</span><br>
<input id="strength" type="range" min="0" max="100" value="65">
</label>
<div class="controls">
<button id="capture" aria-label="Take photo"></button>
</div>
<div class="controls">
<button id="save" disabled>SAVE PHOTO</button>
<button id="again" disabled>RETAKE</button>
</div>
<div id="message">Allow camera access to begin.</div>
<img id="result" alt="Your REWIND photo">
</main>
<footer>CAPTURE THE MOMENT</footer>
<script>
const video=document.querySelector('#video');
const canvas=document.querySelector('#canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const placeholder=document.querySelector('#placeholder');
const message=document.querySelector('#message');
const strength=document.querySelector('#strength');
const amount=document.querySelector('#amount');
let stream=null,front=false,photoURL=null;

strength.oninput=()=>amount.textContent=strength.value+'%';

async function startCamera(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:front?'user':'environment'},audio:false
  });
  video.srcObject=stream;
  await video.play();
  video.style.display='block';
  canvas.style.display='none';
  placeholder.style.display='none';
  message.textContent='CAMERA READY';
 }catch(e){message.textContent='Camera unavailable. Allow camera access in Safari settings.'}
}
document.querySelector('#start').onclick=startCamera;
document.querySelector('#flip').onclick=async()=>{front=!front;await startCamera()};

function takePhoto(){
 if(!stream){message.textContent='Open the camera first.';return}
 const w=720,h=Math.round(w*video.videoHeight/video.videoWidth);
 canvas.width=w;canvas.height=h;
 ctx.drawImage(video,0,0,w,h);
 const original=ctx.getImageData(0,0,w,h);
 const src=original.data;
 const output=ctx.createImageData(w,h);
 const dst=output.data;
 const power=Number(strength.value)/100*.48;
 const cx=(w-1)/2,cy=(h-1)/2;
 const maxR=Math.sqrt(cx*cx+cy*cy);
 for(let y=0;y<h;y++){
  for(let x=0;x<w;x++){
   const nx=(x-cx)/maxR,ny=(y-cy)/maxR;
   const r=Math.sqrt(nx*nx+ny*ny);
   const factor=1+power*r*r;
   const sx=Math.round(cx+(x-cx)/factor);
   const sy=Math.round(cy+(y-cy)/factor);
   const si=(Math.max(0,Math.min(h-1,sy))*w+Math.max(0,Math.min(w-1,sx)))*4;
   const di=(y*w+x)*4;
   const vignette=1-Math.min(.38,r*r*.38);
   dst[di]=src[si]*vignette;
   dst[di+1]=src[si+1]*vignette;
   dst[di+2]=src[si+2]*vignette;
   dst[di+3]=255;
  }
 }
 ctx.putImageData(output,0,0);
 video.style.display='none';
 canvas.style.display='block';
 placeholder.style.display='none';
 photoURL=canvas.toDataURL('image/jpeg',.92);
 document.querySelector('#result').src=photoURL;
 document.querySelector('#result').style.display='block';
 document.querySelector('#save').disabled=false;
 document.querySelector('#again').disabled=false;
 message.textContent='PHOTO CAPTURED';
}
document.querySelector('#capture').onclick=takePhoto;

document.querySelector('#again').onclick=()=>{
 document.querySelector('#result').style.display='none';
 canvas.style.display='none';
 video.style.display='block';
 document.querySelector('#save').disabled=true;
 document.querySelector('#again').disabled=true;
 message.textContent='READY FOR ANOTHER';
};
document.querySelector('#save').onclick=async()=>{
 if(!photoURL)return;
 const blob=await (await fetch(photoURL)).blob();
 const file=new File([blob],'rewind-photo.jpg',{type:'image/jpeg'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:'REWIND photo'});
  }else{
   const a=document.createElement('a');
   a.href=photoURL;a.download='rewind-photo.jpg';a.click();
  }
 }catch(e){message.textContent='Photo ready to save or share.'}
};
</script>
</body>
</html>
