

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REWIND">
<title>REWIND</title>

<style>
:root {
  --black:#050505;
  --white:#fff;
  --red:#ed2424;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  touch-action:pan-y;
}

/* A restrained interface vignette keeps the controls legible
   without covering the live camera image. */
body::after {
  content:"";
  position:absolute;
  z-index:2;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(0,0,0,.34) 0%,transparent 24%),
    linear-gradient(0deg,rgba(0,0,0,.58) 0%,transparent 36%);
}

body {
  position:fixed;
  inset:0;
}

#cameraCanvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:var(--black);
}

#cameraVideo {
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

/* TOP LOGO */

.top {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 17px);
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
}

.logo {
  width:136px;
  height:auto;
  max-height:70px;
  object-fit:contain;
  transition:filter .55s ease;
}

.logo.full-frame {
  /* Original artwork is white on black: invert it, then screen away
     the white background so only black lettering and its white outline remain. */
  filter:
    invert(1)
    drop-shadow(1px 0 0 white)
    drop-shadow(-1px 0 0 white)
    drop-shadow(0 1px 0 white)
    drop-shadow(0 -1px 0 white);
  mix-blend-mode:screen;
}

/* RECORDING */

.recording-label {
  position:absolute;
  top:50%;
  right:22px;
  transform:translateY(-50%);
  display:none;
  align-items:center;
  gap:8px;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
}

.recording-label.active {
  display:flex;
}

.recording-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  animation:blink 1s infinite;
}

@keyframes blink {
  50% {opacity:.25;}
}

/* BOTTOM CAMERA SYSTEM */

.bottom {
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 12px);
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}

.camera-controls {
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:auto;
}

/* MODE SELECTOR */

.mode-selector {
  position:relative;
  width:min(224px, 72vw);
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  touch-action:pan-y;
}

.mode-names {
  position:relative;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  overflow:visible;
}

.mode-name {
  flex:1;
  min-width:0;
  padding:5px 0;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.29);
  font-family:inherit;
  font-size:9px;
  font-weight:700;
  letter-spacing:1px;
  text-align:center;
  white-space:nowrap;
  opacity:.7;
  transform:scale(.78);
  transition:
    color .62s ease,
    opacity .62s ease,
    transform .68s cubic-bezier(.22,.8,.25,1),
    letter-spacing .62s ease;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

.mode-name.active {
  color:white;
  opacity:1;
  transform:scale(1.12);
  letter-spacing:2px;
}

/* ZOOM POPUP */

.zoom-panel {
  position:absolute;
  z-index:8;
  left:50%;
  bottom:calc(100% + 4px);
  transform:translate(-50%, 8px);
  width:min(260px, 78vw);
  padding:12px 15px 10px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:16px;
  background:rgba(8,8,8,.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .5s ease, transform .5s ease, visibility .5s;
}

.zoom-panel.open {
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translate(-50%, 0);
}

.zoom-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
  color:rgba(255,255,255,.65);
}

#zoomValue {
  color:white;
  font-size:12px;
  letter-spacing:1px;
}

#zoomSlider {
  width:100%;
  height:4px;
  margin:0;
  border-radius:10px;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  background:rgba(255,255,255,.35);
  touch-action:pan-x;
}

#zoomSlider::-webkit-slider-thumb {
  appearance:none;
  -webkit-appearance:none;
  width:19px;
  height:19px;
  border-radius:50%;
  background:white;
  border:2px solid #777;
  box-shadow:0 0 0 4px rgba(255,255,255,.12);
}

#zoomSlider::-moz-range-thumb {
  width:16px;
  height:16px;
  border-radius:50%;
  background:white;
  border:2px solid #777;
}

/* SHUTTER AND ZOOM BUTTON */

.shutter-row {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

#shutter {
  width:62px;
  height:62px;
  border:3px solid white;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  touch-action:pan-y;
  outline:none;
  transition:border-color .5s, background .5s;
}

#shutter::before {
  content:"";
  position:absolute;
  inset:-6px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
}

#shutter .inner {
  width:48px;
  height:48px;
  border-radius:50%;
  background:white;
  box-shadow:0 1px 10px rgba(255,255,255,.18);
  transition:all .48s ease;
}

/* ZOOM BUTTON */

#zoomButton {
  position:absolute;
  left:calc(50% + 49px);
  top:50%;
  transform:translateY(-50%);
  min-width:48px;
  padding:7px 6px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:25px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:background .5s, border-color .5s;
}

#zoomButton.active {
  border-color:white;
  background:rgba(255,255,255,.15);
}

/* VIDEO */

#shutter.video-mode {
  border-color:var(--red);
}

#shutter.video-mode .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--red);
}

#shutter.video-mode.recording .inner {
  width:38px;
  height:38px;
  border-radius:7px;
}

/* SLOW MOTION */

#shutter.slow-mode {
  border-color:#d9d9d9;
}

#shutter.slow-mode .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:#d9d9d9;
}

#shutter.slow-mode.recording .inner {
  width:38px;
  height:38px;
  border-radius:7px;
  background:var(--red);
}

/* START SCREEN */

#startScreen {
  opacity:1;
  transform:scale(1);
  filter:blur(0);
  transition:
    opacity .92s cubic-bezier(.22,.75,.25,1),
    transform 1.02s cubic-bezier(.22,.75,.25,1),
    filter .92s ease;
  will-change:opacity,transform,filter;
  position:absolute;
  z-index:10;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:var(--black);
  padding:30px;
  text-align:center;
}

.start-logo {
  width:min(75vw,330px);
  height:auto;
  margin-bottom:35px;
}

#startScreen p {
  max-width:270px;
  color:#888;
  font-size:12px;
  line-height:1.7;
  letter-spacing:1px;
  margin:0 0 28px;
}

#startButton {
  border:1px solid white;
  background:white;
  color:black;
  border-radius:30px;
  padding:15px 30px;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

#startScreen.leaving {
  opacity:0;
  transform:scale(1.035);
  filter:blur(8px);
  pointer-events:none;
}

.top,
.bottom {
  opacity:0;
  transform:translateY(10px);
  transition:
    opacity .86s ease,
    transform .94s cubic-bezier(.22,.75,.25,1);
}

body.camera-active .top,
body.camera-active .bottom {
  opacity:1;
  transform:translateY(0);
}

body.camera-active .top {
  transition-delay:.08s;
}

body.camera-active .bottom {
  transition-delay:.14s;
}

@media (prefers-reduced-motion:reduce) {
  #startScreen,
  .top,
  .bottom {
    transition:none !important;
  }
}

#errorMessage {
  color:#e66;
  font-size:11px;
  line-height:1.5;
  max-width:290px;
  margin-top:20px;
}

#statusMessage {
  position:absolute;
  z-index:8;
  bottom:calc(env(safe-area-inset-bottom) + 115px);
  left:20px;
  right:20px;
  text-align:center;
  font-size:10px;
  letter-spacing:1.5px;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:opacity .5s;
}

#statusMessage.show {
  opacity:1;
}

/* LANDSCAPE */

@media (orientation:landscape) {
  .top {
    top:calc(env(safe-area-inset-top) + 8px);
  }

  .logo {
    width:110px;
  }

  .bottom {
    bottom:calc(env(safe-area-inset-bottom) + 5px);
  }

  .mode-selector {
    width:210px;
    padding:0;
    gap:3px;
  }

  #shutter {
    width:62px;
    height:62px;
  }

  #shutter .inner {
    width:48px;
    height:48px;
  }

  #shutter.video-mode .inner,
  #shutter.slow-mode .inner {
    width:52px;
    height:52px;
  }

  #shutter.video-mode.recording .inner,
  #shutter.slow-mode.recording .inner {
    width:34px;
    height:34px;
  }

  #zoomButton {
    left:calc(50% + 49px);
  }

  #statusMessage {
    bottom:calc(env(safe-area-inset-bottom) + 90px);
  }
}

@media (prefers-reduced-motion:reduce) {
  .mode-name,
  #shutter,
  #shutter .inner,
  .zoom-panel {
    transition:none;
  }
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay muted playsinline></video>
<canvas id="cameraCanvas"></canvas>

<header class="top">
  <img
    class="logo"
    id="mainLogo"
    src="IMG_1940.png"
    alt="REWIND"
  >

  <div class="recording-label" id="recordingLabel">
    <span class="recording-dot"></span>
    <span id="recordingTime">REC 00:00</span>
  </div>
</header>

<div class="bottom">
  <div class="camera-controls">
    <div class="mode-selector" id="modeSelector">

      <div class="mode-names">

        <div class="zoom-panel" id="zoomPanel">
          <div class="zoom-heading">
            <span>ZOOM</span>
            <span id="zoomValue">1.0×</span>
          </div>
          <input
            id="zoomSlider"
            type="range"
            min="1"
            max="3"
            step="0.1"
            value="1"
          >
        </div>

        <button class="mode-name" data-mode="slow">SLOW-MO</button>
        <button class="mode-name active" data-mode="photo">PHOTO</button>
        <button class="mode-name" data-mode="video">VIDEO</button>
      </div>

      <div class="shutter-row">
        <button id="shutter" aria-label="Capture">
          <span class="inner"></span>
        </button>

        <button id="zoomButton" aria-label="Adjust zoom">1.0×</button>
      </div>

    </div>
  </div>
</div>

<div id="statusMessage"></div>

<div id="startScreen">
  <img
    class="start-logo"
    src="IMG_1940.png"
    alt="REWIND"
  >
  <p>A different way to capture the moment. Allow camera access to begin.</p>
  <button id="startButton">OPEN CAMERA</button>
  <div id="errorMessage"></div>
</div>

<script>
"use strict";

const video = document.getElementById("cameraVideo");
const canvas = document.getElementById("cameraCanvas");
const gl = canvas.getContext("webgl", {
  alpha:false,
  antialias:false,
  preserveDrawingBuffer:true
});

const shutter = document.getElementById("shutter");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const errorMessage = document.getElementById("errorMessage");
const statusMessage = document.getElementById("statusMessage");
const recordingLabel = document.getElementById("recordingLabel");
const recordingTime = document.getElementById("recordingTime");
const zoomButton = document.getElementById("zoomButton");
const zoomPanel = document.getElementById("zoomPanel");
const zoomSlider = document.getElementById("zoomSlider");
const zoomValue = document.getElementById("zoomValue");
const mainLogo = document.getElementById("mainLogo");

let cameraStream = null;
let cameraReady = false;
let recorder = null;
let recordedChunks = [];
let recording = false;
let recordingStartedAt = 0;
let recordingClock = null;
let lensShape = 0;
let displayLensShape = 0;
let lensTransitionFrame = null;
let animationFrame = null;
let texture = null;
let program = null;
let statusTimeout = null;
let currentMode = "photo";
let slowProcessing = false;
let slowSourceUrl = null;

let zoomLevel = 1;
let slowLensShape = 0;
let slowZoomLevel = 1;

// Physical rear-camera selection. iOS Safari may expose only a virtual
// rear camera; use the ultra-wide lens only when it is explicitly identified.
let defaultCameraDeviceId = null;
let ultraWideCameraDeviceId = null;
let ultraWideActive = false;
let cameraSwitching = false;

/* SHADERS */

const vertexShaderSource = `
attribute vec2 position;
varying vec2 vUv;

void main(){
  vUv = position * .5 + .5;
  gl_Position = vec4(position,0.,1.);
}`;

const fragmentShaderSource = `
precision highp float;

varying vec2 vUv;

uniform sampler2D uVideo;
uniform vec2 uResolution;
uniform vec2 uVideoResolution;
uniform float uShape;
uniform float uTime;
uniform float uZoom;

void main(){
  vec2 p = (vUv - .5) * 2.0;
  float aspect = uResolution.x / uResolution.y;
  p.x *= aspect;

  // Keep the fisheye circle sized to the shorter screen dimension.
  // This prevents the lens from becoming oversized in landscape.
  float lensRadius = min(aspect,1.0) * .94;
  vec2 lens = vec2(p.x / lensRadius, p.y / lensRadius);
  float angle = atan(lens.y,lens.x);
  float rawRadius = length(lens);

  float edgeDistortion =
      sin(angle * 5.0 + .4) * .004
    + sin(angle * 9.0 + 1.2) * .0025
    + sin(angle * 13.0 + 2.1) * .0012;
  float r = rawRadius / (1.0 + edgeDistortion);

  vec2 direction = rawRadius > .0001 ? lens / rawRadius : vec2(0.0);
  float circleMapped = r + .34 * pow(r,4.0) * (1.0-r);
  vec2 circleWarped = direction * circleMapped;

  // Full Frame uses a straight, rectilinear image with no fisheye warp.
  // Circle mode keeps its original optical mapping.
  vec2 fullWarped = p;

  // Smoothly morph the actual lens mapping instead of switching abruptly.
  vec2 warped = mix(circleWarped,fullWarped,uShape);

  float videoAspect = uVideoResolution.x / uVideoResolution.y;
  vec2 uv = vec2(.5);
  // Cover the full display in either orientation, cropping only the
  // longer source dimension instead of shrinking the image and exposing black.
  if(videoAspect > aspect){
    uv.x += warped.x * (aspect/videoAspect) * .5;
    uv.y += warped.y * .5;
  }else{
    uv.x += warped.x * .5;
    uv.y += warped.y * (aspect/videoAspect) * .5;
  }

  uv = vec2(.5) + (uv-vec2(.5))/uZoom;
  if(uv.x<0.0 || uv.x>1.0 || uv.y<0.0 || uv.y>1.0){
    gl_FragColor = vec4(0.,0.,0.,1.);
    return;
  }

  float aberration = pow(min(r,1.0),3.0)*.006*(1.0-uShape);
  vec2 offset = direction*aberration;
  float red = texture2D(uVideo,clamp(uv+offset,vec2(.001),vec2(.999))).r;
  float green = texture2D(uVideo,uv).g;
  float blue = texture2D(uVideo,clamp(uv-offset,vec2(.001),vec2(.999))).b;
  vec3 colour = vec3(red,green,blue);

  float centreGlow = mix(1.0,1.0 + .10*exp(-r*r*4.0),1.0-uShape);
  float circleFalloff =
      (1.0-.28*smoothstep(.25,1.0,r))
    * (1.0-.48*smoothstep(.62,1.0,r));
  float opticalFalloff = mix(circleFalloff,1.0,uShape);
  float directionalLight = mix(1.0,1.0-.09*smoothstep(-.4,1.0,lens.y),1.0-uShape);
  colour *= centreGlow*directionalLight*opticalFalloff;

  colour.r *= mix(1.0,1.035,1.0-uShape);
  colour.g *= mix(1.0,1.005,1.0-uShape);
  colour.b *= mix(1.0,.965,1.0-uShape);

  float grain = fract(sin(dot(gl_FragCoord.xy+uTime,vec2(12.9898,78.233)))*43758.5453);
  colour += (grain-.5)*.025*(1.0-uShape);

  float redRing = exp(-pow((r-.974)/.0045,2.0));
  float greenRing = exp(-pow((r-.990)/.0045,2.0));
  colour.r += redRing*.13*(1.0-uShape);
  colour.g += greenRing*.085*(1.0-uShape);

  float circleMask = 1.0-smoothstep(.994,1.0,r);
  colour *= mix(circleMask,1.0,uShape);

  float blueEdge = exp(-pow((r-.978)/.022,2.0));
  float blueStrength = blueEdge*.065*(1.0-uShape);
  colour = mix(colour,vec3(.035,.16,.48),blueStrength);
  colour.b += blueEdge*.025*(1.0-uShape);

  // The circular edge and its halo fade away continuously during the morph.
  float outsideCircle = smoothstep(1.0,1.055,r)*(1.0-uShape);
  float halo = (1.0-smoothstep(1.0,1.055,r))*.045*(1.0-uShape);
  vec3 haloColour = vec3(.015,.075,.30)*halo;
  colour = mix(colour,haloColour,outsideCircle);

  gl_FragColor = vec4(colour,1.0);
}`;

/* WEBGL SETUP */

function createShader(type,source){
  const shader = gl.createShader(type);

  gl.shaderSource(shader,source);
  gl.compileShader(shader);

  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(shader));
  }

  return shader;
}

function setupWebGL(){
  if(!gl) throw new Error("WebGL is unavailable.");

  const vs = createShader(gl.VERTEX_SHADER,vertexShaderSource);
  const fs = createShader(gl.FRAGMENT_SHADER,fragmentShaderSource);

  program = gl.createProgram();

  gl.attachShader(program,vs);
  gl.attachShader(program,fs);
  gl.linkProgram(program);

  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
    throw new Error(gl.getProgramInfoLog(program));
  }

  gl.useProgram(program);

  const buffer = gl.createBuffer();

  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);

  gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([-1,-1,1,-1,-1,1,1,1]),
    gl.STATIC_DRAW
  );

  const position = gl.getAttribLocation(program,"position");

  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

  texture = gl.createTexture();

  gl.bindTexture(gl.TEXTURE_2D,texture);

  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
}

/* CANVAS */

function resizeCanvas(){
  const dpr = Math.min(devicePixelRatio||1,1.5);

  const width = Math.round(innerWidth*dpr);
  const height = Math.round(innerHeight*dpr);

  if(canvas.width!==width || canvas.height!==height){
    canvas.width = width;
    canvas.height = height;
  }

  if(gl){
    gl.viewport(0,0,canvas.width,canvas.height);
  }
}

/* RENDER LOOP */

function render(now=0){
  if(!gl || !program) return;

  if(video.readyState >= video.HAVE_CURRENT_DATA){

    gl.useProgram(program);
    gl.bindTexture(gl.TEXTURE_2D,texture);

    try{
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        video
      );
    }catch(e){}

    const activeShape = slowProcessing ? slowLensShape : displayLensShape;
    const selectedZoom = slowProcessing ? slowZoomLevel : zoomLevel;
    const activeUltraWide = slowProcessing ? slowLensShape===1 && ultraWideActive : ultraWideActive;
    const activeZoom = selectedZoom * (activeUltraWide ? 1.4 : 1.0);

    gl.uniform1i(gl.getUniformLocation(program,"uVideo"),0);

    gl.uniform2f(
      gl.getUniformLocation(program,"uResolution"),
      canvas.width,
      canvas.height
    );

    gl.uniform2f(
      gl.getUniformLocation(program,"uVideoResolution"),
      video.videoWidth||1,
      video.videoHeight||1
    );

    gl.uniform1f(
      gl.getUniformLocation(program,"uShape"),
      activeShape
    );

    gl.uniform1f(
      gl.getUniformLocation(program,"uZoom"),
      activeZoom
    );

    gl.uniform1f(
      gl.getUniformLocation(program,"uTime"),
      now*.001
    );

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  animationFrame = requestAnimationFrame(render);
}

/* CAMERA */

async function startCamera(){
  errorMessage.textContent = "";
  startButton.textContent = "OPENING CAMERA";

  try{

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Open REWIND in Safari using its HTTPS address.");
    }

    if(cameraStream){
      cameraStream.getTracks().forEach(track=>track.stop());
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920},
        height:{ideal:1080},
        frameRate:{ideal:120,max:120}
      }
    });

    // Once permission is granted, camera labels and device IDs become visible.
    // Prefer a separately exposed ultra-wide camera for Full Frame mode.
    const initialTrack = cameraStream.getVideoTracks()[0];
    defaultCameraDeviceId = initialTrack?.getSettings?.().deviceId || null;

    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const rearCameras = devices.filter(device =>
        device.kind === "videoinput" &&
        /back|rear|environment/i.test(device.label)
      );

      const ultraWideCamera = rearCameras.find(device =>
        /ultra.?wide|ultrawide|0[.,]5\\s*x|0[.,]5x|\.5\\s*x|\.5x/i.test(device.label)
      );

      if (ultraWideCamera) {
        ultraWideCameraDeviceId = ultraWideCamera.deviceId;
      }
    } catch (deviceError) {
      console.warn("Could not enumerate camera lenses:",deviceError);
    }

    video.srcObject = cameraStream;
    video.removeAttribute("src");
    video.playbackRate = 1;

    await video.play();

    cameraReady = true;

    if(!program){
      setupWebGL();
    }

    resizeCanvas();

    cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(render);

    // Reveal the live camera first, then smoothly dismiss the opening screen.
    requestAnimationFrame(()=>{
      document.body.classList.add("camera-active");
      startScreen.classList.add("leaving");
    });

    startScreen.addEventListener("transitionend",event=>{
      if(event.target===startScreen && event.propertyName==="opacity"){
        startScreen.style.display="none";
      }
    },{once:true});

  }catch(error){

    console.error(error);

    errorMessage.textContent =
      error.message || "Unable to access the camera. Check camera permissions.";

    startButton.textContent = "TRY AGAIN";
  }
}

startButton.addEventListener("click",startCamera);

/* LENS */

async function switchPhysicalCamera(deviceId,isUltraWide){
  if(!deviceId || !cameraReady || cameraSwitching) return false;

  const currentTrack = cameraStream?.getVideoTracks?.()[0];
  const currentId = currentTrack?.getSettings?.().deviceId;

  if(currentId === deviceId){
    ultraWideActive = isUltraWide;
    return true;
  }

  cameraSwitching = true;

  try {
    const nextStream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:{
        deviceId:{exact:deviceId},
        width:{ideal:1920},
        height:{ideal:1080},
        frameRate:{ideal:120,max:120}
      }
    });

    const previousStream = cameraStream;
    video.srcObject = nextStream;
    await video.play();

    cameraStream = nextStream;
    previousStream?.getTracks?.().forEach(track=>track.stop());

    ultraWideActive = isUltraWide;
    return true;
  } catch(error) {
    // Keep the working camera alive if the requested physical lens fails.
    if (cameraStream) video.srcObject = cameraStream;
    console.warn("Physical camera switch unavailable:",error);
    return false;
  } finally {
    cameraSwitching = false;
  }
}

function animateLensTo(shape){
  cancelAnimationFrame(lensTransitionFrame);

  const from = displayLensShape;
  const to = shape;
  const startedAt = performance.now();
  const duration = 820;

  function frame(now){
    const progress = Math.min(1,(now-startedAt)/duration);
    // Smooth ease-in-out with no abrupt start or stop.
    const eased = progress<.5
      ? 4*progress*progress*progress
      : 1-Math.pow(-2*progress+2,3)/2;

    displayLensShape = from+(to-from)*eased;

    if(progress<1){
      lensTransitionFrame = requestAnimationFrame(frame);
    }else{
      displayLensShape = to;
      lensTransitionFrame = null;
    }
  }

  lensTransitionFrame = requestAnimationFrame(frame);
}

function setLens(shape){
  if(shape===lensShape) return;

  lensShape = shape;
  mainLogo.classList.toggle("full-frame",shape===1);
  animateLensTo(shape);
  updateZoomInterface();

  // Start the physical lens change independently. The visual morph keeps
  // running while Safari prepares the new camera stream.
  if(shape===1 && ultraWideCameraDeviceId){
    switchPhysicalCamera(ultraWideCameraDeviceId,true).then(switched=>{
      if(!switched) showStatus("ULTRA-WIDE LENS COULD NOT BE SELECTED");
    });
  }else if(shape===0 && defaultCameraDeviceId){
    switchPhysicalCamera(defaultCameraDeviceId,false).then(switched=>{
      if(!switched) showStatus("COULD NOT RESTORE MAIN CAMERA");
    });
  }else if(shape===1 && !ultraWideCameraDeviceId){
    ultraWideActive = false;
    showStatus("ULTRA-WIDE LENS NOT EXPOSED BY SAFARI");
  }

  if(shape===0 && zoomLevel<1){
    zoomLevel = 1;
    updateZoomInterface();
  }
}

/* SWIPE LENS CONTROL
   Swipe left across the middle of the preview for Full Frame.
   Swipe right to return to Circle. Top and bottom controls are ignored. */

let lensSwipeStartX = 0;
let lensSwipeStartY = 0;
let lensSwipeActive = false;

document.addEventListener("touchstart",event=>{
  if(event.touches.length!==1) {
    lensSwipeActive = false;
    return;
  }

  const touch = event.touches[0];
  const target = event.target;
  const y = touch.clientY;

  if(
    y < window.innerHeight*.2 ||
    y > window.innerHeight*.8 ||
    target.closest("button, input, .bottom, .top, #startScreen")
  ){
    lensSwipeActive = false;
    return;
  }

  lensSwipeStartX = touch.clientX;
  lensSwipeStartY = touch.clientY;
  lensSwipeActive = true;
},{passive:true});

document.addEventListener("touchend",event=>{
  if(!lensSwipeActive) return;

  lensSwipeActive = false;

  const touch = event.changedTouches[0];
  const dx = touch.clientX-lensSwipeStartX;
  const dy = touch.clientY-lensSwipeStartY;

  if(Math.abs(dx)<55 || Math.abs(dx)<Math.abs(dy)*1.35) return;

  if(dx<0 && lensShape===0){
    setLens(1);
  }else if(dx>0 && lensShape===1){
    setLens(0);
  }
},{passive:true});

document.addEventListener("touchcancel",()=>{
  lensSwipeActive = false;
},{passive:true});

/* PINCH-TO-ZOOM
   Two-finger pinch on the live preview adjusts the same zoom value
   used by the slider and the camera shader. */
let pinchStartDistance = 0;
let pinchStartZoom = 1;
let pinching = false;

function getTouchDistance(touches){
  const dx = touches[0].clientX-touches[1].clientX;
  const dy = touches[0].clientY-touches[1].clientY;
  return Math.hypot(dx,dy);
}

canvas.addEventListener("touchstart",event=>{
  if(event.touches.length!==2 || !cameraReady) return;

  event.preventDefault();
  pinching = true;
  lensSwipeActive = false;
  pinchStartDistance = Math.max(1,getTouchDistance(event.touches));
  pinchStartZoom = zoomLevel;
},{passive:false});

canvas.addEventListener("touchmove",event=>{
  if(!pinching || event.touches.length!==2) return;

  event.preventDefault();

  const distance = getTouchDistance(event.touches);
  const scale = distance/pinchStartDistance;
  const minimum = lensShape===1 ? .5 : 1;

  zoomLevel = Math.max(minimum,Math.min(3,pinchStartZoom*scale));
  zoomLevel = Math.round(zoomLevel*10)/10;
  updateZoomInterface();
},{passive:false});

function finishPinch(event){
  if(pinching && event.touches.length<2){
    pinching = false;
    pinchStartDistance = 0;
  }
}

canvas.addEventListener("touchend",finishPinch,{passive:true});
canvas.addEventListener("touchcancel",()=>{
  pinching = false;
  pinchStartDistance = 0;
},{passive:true});

/* ZOOM */

function updateZoomInterface(){
  const minimum = lensShape===1 ? .5 : 1;

  zoomSlider.min = String(minimum);
  zoomSlider.max = "3";
  zoomSlider.value = String(zoomLevel);

  zoomValue.textContent = zoomLevel.toFixed(1)+"×";
  zoomButton.textContent = zoomLevel.toFixed(1)+"×";
}

zoomButton.addEventListener("click",event=>{
  event.stopPropagation();

  const isOpen = zoomPanel.classList.toggle("open");

  zoomButton.classList.toggle("active",isOpen);
});

zoomPanel.addEventListener("click",event=>{
  event.stopPropagation();
});

zoomSlider.addEventListener("input",()=>{
  zoomLevel = Number(zoomSlider.value);
  updateZoomInterface();
});

document.addEventListener("click",event=>{
  if(
    !zoomPanel.contains(event.target) &&
    !zoomButton.contains(event.target)
  ){
    zoomPanel.classList.remove("open");
    zoomButton.classList.remove("active");
  }
});

/* MODES */

function setMode(mode){
  if(recording || slowProcessing){
    showStatus("FINISH RECORDING FIRST");
    return;
  }

  currentMode = mode;

  document.querySelectorAll(".mode-name").forEach(el=>{
    el.classList.toggle("active",el.dataset.mode===mode);
  });

  shutter.classList.remove("video-mode","slow-mode","recording");

  if(mode==="video"){
    shutter.classList.add("video-mode");
  }else if(mode==="slow"){
    shutter.classList.add("slow-mode");
  }
}

document.querySelectorAll(".mode-name").forEach(button=>{
  button.addEventListener("click",()=>{
    setMode(button.dataset.mode);
  });
});

/* STATUS */

function showStatus(message){
  statusMessage.textContent = message;
  statusMessage.classList.add("show");

  clearTimeout(statusTimeout);

  statusTimeout = setTimeout(()=>{
    statusMessage.classList.remove("show");
  },2600);
}

/* SWIPE MODE SELECTOR */

let swipeStartX = 0;
let swipeStartY = 0;
let swiping = false;

const modeSelector = document.getElementById("modeSelector");

modeSelector.addEventListener("touchstart",event=>{
  if(event.touches.length!==1) return;

  swipeStartX = event.touches[0].clientX;
  swipeStartY = event.touches[0].clientY;
  swiping = true;
},{passive:true});

modeSelector.addEventListener("touchend",event=>{
  if(!swiping) return;

  swiping = false;

  const dx = event.changedTouches[0].clientX-swipeStartX;
  const dy = event.changedTouches[0].clientY-swipeStartY;

  if(Math.abs(dx)<35 || Math.abs(dx)<Math.abs(dy)) return;

  const modes = ["slow","photo","video"];
  let index = modes.indexOf(currentMode);

  if(dx<0) index = Math.min(2,index+1);
  else index = Math.max(0,index-1);

  setMode(modes[index]);
},{passive:true});

/* FILE SAVING */

async function saveFile(blob,filename){
  const file = new File([blob],filename,{type:blob.type});

  if(navigator.share && navigator.canShare?.({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:"REWIND"
      });

      return;

    }catch(error){
      if(error.name==="AbortError") return;
    }
  }

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),15000);
}

/* PHOTO */

function takePhoto(){
  if(!cameraReady || recording || slowProcessing) return;

  canvas.toBlob(async blob=>{
    if(!blob){
      showStatus("PHOTO COULD NOT BE SAVED");
      return;
    }

    await saveFile(blob,"REWIND-"+Date.now()+".jpg");

    showStatus("PHOTO CAPTURED");

  },"image/jpeg",.96);
}

/* VIDEO FORMAT */

function supportedMime(){
  const formats = [
    "video/mp4;codecs=avc1.42E01E",
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  return formats.find(type=>MediaRecorder.isTypeSupported(type)) || "";
}

/* RECORDING CLOCK */

function updateRecordingClock(){
  if(!recording) return;

  const seconds = Math.floor((Date.now()-recordingStartedAt)/1000);

  recordingTime.textContent = "REC "+
    String(Math.floor(seconds/60)).padStart(2,"0")+":"+
    String(seconds%60).padStart(2,"0");
}

function beginRecordingClock(){
  recordingStartedAt = Date.now();

  recordingLabel.classList.add("active");

  updateRecordingClock();

  recordingClock = setInterval(updateRecordingClock,250);
}

function endRecordingClock(){
  clearInterval(recordingClock);
  recordingLabel.classList.remove("active");
}

/* NORMAL VIDEO */

function startNormalVideo(){
  if(!cameraReady || recording) return;

  try{

    const stream = canvas.captureStream(30);

    cameraStream.getAudioTracks().forEach(track=>{
      stream.addTrack(track);
    });

    const mimeType = supportedMime();

    recorder = new MediaRecorder(
      stream,
      mimeType ? {mimeType} : {}
    );

    recordedChunks = [];

    recorder.ondataavailable = event=>{
      if(event.data?.size){
        recordedChunks.push(event.data);
      }
    };

    recorder.onstop = async()=>{
      const type = recorder.mimeType || "video/webm";
      const ext = type.includes("mp4") ? "mp4" : "webm";

      const blob = new Blob(recordedChunks,{type});

      stream.getTracks().forEach(track=>track.stop());

      if(blob.size){
        await saveFile(
          blob,
          "REWIND-VIDEO-"+Date.now()+"."+ext
        );

        showStatus("VIDEO READY TO SAVE");
      }

      recordedChunks = [];
    };

    recorder.start(250);

    recording = true;

    shutter.classList.add("recording");

    beginRecordingClock();

  }catch(error){

    console.error(error);
    showStatus("COULD NOT START VIDEO");
  }
}

function stopNormalVideo(){
  if(!recording || !recorder) return;

  recording = false;

  endRecordingClock();

  shutter.classList.remove("recording");

  if(recorder.state!=="inactive"){
    recorder.stop();
  }
}

/* SLOW MOTION RECORDING */

async function startSlowMotion(){
  if(!cameraReady || recording || slowProcessing) return;

  if(!canvas.captureStream || !window.MediaRecorder){
    showStatus("SLOW MOTION NOT SUPPORTED");
    return;
  }

  try{

    // Lock the lens and zoom settings for the entire recording.
    slowLensShape = lensShape;
    slowZoomLevel = zoomLevel;

    const sourceStream = canvas.captureStream(60);
    const mimeType = supportedMime();

    const sourceRecorder = new MediaRecorder(
      sourceStream,
      mimeType ? {mimeType} : {}
    );

    const sourceChunks = [];

    sourceRecorder.ondataavailable = event=>{
      if(event.data?.size){
        sourceChunks.push(event.data);
      }
    };

    sourceRecorder.onstop = async()=>{
      sourceStream.getTracks().forEach(track=>track.stop());

      const sourceType = sourceRecorder.mimeType || "video/webm";

      const sourceBlob = new Blob(sourceChunks,{type:sourceType});

      if(!sourceBlob.size){
        recording = false;
        slowProcessing = false;
        resetShutter();
        showStatus("SLOW MOTION FAILED");
        return;
      }

      await processSlowMotion(sourceBlob);
    };

    sourceRecorder.start(250);

    recorder = sourceRecorder;
    recording = true;

    shutter.classList.add("recording");

    beginRecordingClock();

    showStatus("SLOW MOTION RECORDING");

  }catch(error){

    console.error(error);

    recording = false;

    resetShutter();

    showStatus("COULD NOT START SLOW MOTION");
  }
}

/* SLOW MOTION EXPORT */

async function processSlowMotion(sourceBlob){
  slowProcessing = true;
  recording = false;

  endRecordingClock();

  shutter.classList.add("recording");

  const originalStream = cameraStream;

  slowSourceUrl = URL.createObjectURL(sourceBlob);

  let outputStream = null;
  let outputRecorder = null;
  let outputChunks = [];

  try{

    video.pause();
    video.srcObject = null;
    video.removeAttribute("src");

    video.loop = false;
    video.muted = true;
    video.playsInline = true;

    video.defaultPlaybackRate = .25;
    video.playbackRate = .25;

    await new Promise((resolve,reject)=>{

      const loaded = ()=>{
        cleanup();
        resolve();
      };

      const failed = ()=>{
        cleanup();
        reject(new Error("Could not load the recorded video."));
      };

      const cleanup = ()=>{
        video.removeEventListener("loadedmetadata",loaded);
        video.removeEventListener("error",failed);
      };

      video.addEventListener("loadedmetadata",loaded,{once:true});
      video.addEventListener("error",failed,{once:true});

      video.src = slowSourceUrl;
      video.load();
    });

    if(video.readyState<video.HAVE_CURRENT_DATA){

      await new Promise((resolve,reject)=>{

        const ready = ()=>{
          cleanup();
          resolve();
        };

        const failed = ()=>{
          cleanup();
          reject(new Error("Could not decode the slow-motion recording."));
        };

        const cleanup = ()=>{
          video.removeEventListener("loadeddata",ready);
          video.removeEventListener("error",failed);
        };

        video.addEventListener("loadeddata",ready,{once:true});
        video.addEventListener("error",failed,{once:true});
      });
    }

    video.defaultPlaybackRate = .25;
    video.playbackRate = .25;

    outputStream = canvas.captureStream(30);

    const outputMime = supportedMime();

    outputRecorder = new MediaRecorder(
      outputStream,
      outputMime ? {mimeType:outputMime} : {}
    );

    outputChunks = [];

    outputRecorder.ondataavailable = event=>{
      if(event.data?.size){
        outputChunks.push(event.data);
      }
    };

    const finished = new Promise((resolve,reject)=>{

      outputRecorder.addEventListener("stop",resolve,{once:true});

      outputRecorder.addEventListener("error",event=>{
        reject(event.error || new Error("Export recording failed."));
      },{once:true});
    });

    const playbackFinished = new Promise((resolve,reject)=>{

      const ended = ()=>{
        cleanup();
        resolve();
      };

      const failed = ()=>{
        cleanup();
        reject(new Error("Slow-motion playback failed."));
      };

      const cleanup = ()=>{
        video.removeEventListener("ended",ended);
        video.removeEventListener("error",failed);
      };

      video.addEventListener("ended",ended,{once:true});
      video.addEventListener("error",failed,{once:true});
    });

    outputRecorder.start(250);

    await new Promise(resolve=>{
      requestAnimationFrame(()=>{
        requestAnimationFrame(resolve);
      });
    });

    await video.play();

    video.playbackRate = .25;

    if(Math.abs(video.playbackRate-.25)>.01){
      throw new Error("This browser is not accepting 4x slow playback.");
    }

    await playbackFinished;

    if(outputRecorder.state!=="inactive"){
      outputRecorder.stop();
    }

    await finished;

    const outputType = outputRecorder.mimeType || "video/webm";
    const extension = outputType.includes("mp4") ? "mp4" : "webm";

    const result = new Blob(outputChunks,{type:outputType});

    if(result.size){

      await saveFile(
        result,
        "REWIND-SLOWMO-4X-"+Date.now()+"."+extension
      );

      showStatus("4× SLOW MOTION READY");

    }else{
      showStatus("SLOW MOTION COULD NOT BE SAVED");
    }

  }catch(error){

    console.error("Slow-motion export error:",error);

    showStatus(error.message || "SLOW MOTION PROCESSING FAILED");

    if(outputRecorder && outputRecorder.state!=="inactive"){
      try{
        outputRecorder.stop();
      }catch(e){}
    }

  }finally{

    if(outputStream){
      outputStream.getTracks().forEach(track=>track.stop());
    }

    // Restore the live camera.
    video.pause();
    video.removeAttribute("src");
    video.srcObject = originalStream;

    video.playbackRate = 1;
    video.defaultPlaybackRate = 1;
    video.muted = true;

    try{
      await video.play();
    }catch(error){
      console.error("Camera restore error:",error);
    }

    if(slowSourceUrl){
      URL.revokeObjectURL(slowSourceUrl);
      slowSourceUrl = null;
    }

    slowProcessing = false;

    resetShutter();
  }
}

function stopSlowMotion(){
  if(!recording || !recorder) return;

  recording = false;

  endRecordingClock();

  if(recorder.state!=="inactive"){
    recorder.stop();
  }
}

/* RESET */

function resetShutter(){
  shutter.classList.remove("recording");
  setMode(currentMode);
}

/* SHUTTER ACTION */

shutter.addEventListener("click",event=>{
  event.preventDefault();

  if(!cameraReady || slowProcessing) return;

  if(currentMode==="photo"){
    takePhoto();
    return;
  }

  if(currentMode==="video"){
    if(recording) stopNormalVideo();
    else startNormalVideo();

    return;
  }

  if(currentMode==="slow"){
    if(recording) stopSlowMotion();
    else startSlowMotion();
  }
});

/* RESIZE */

// Recalculate the drawing surface after every viewport/orientation change.
let resizeFrame = null;

function scheduleCanvasResize(){
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(()=>{
    resizeCanvas();
    // iOS Safari can update its viewport dimensions a moment after rotation.
    setTimeout(resizeCanvas,180);
  });
}

window.addEventListener("resize",scheduleCanvasResize);
window.addEventListener("orientationchange",scheduleCanvasResize);

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",scheduleCanvasResize);
}

/* CLEANUP */

window.addEventListener("pagehide",()=>{
  cancelAnimationFrame(animationFrame);

  clearInterval(recordingClock);

  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
  }
});

/* INITIAL SETTINGS */

updateZoomInterface();
setMode("photo");

</script>
