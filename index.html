
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REWIND">
<title>REWIND</title>

<style>
:root {
  --black:#050505;
  --white:#fff;
  --red:#ed2424;
}
* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}
html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  touch-action:manipulation;
}
body { position:fixed; inset:0; }

#cameraCanvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:var(--black);
}
#cameraVideo {
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

/* LOGO */
.top {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 20px);
  left:22px;
  right:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}
.logo {
  width:150px;
  height:auto;
  max-height:70px;
  object-fit:contain;
  object-position:left center;
}

/* RECORDING */
.recording-label {
  display:none;
  align-items:center;
  gap:8px;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
}
.recording-label.active { display:flex; }
.recording-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  animation:blink 1s infinite;
}
@keyframes blink { 50% {opacity:.25;} }

/* LENS OPTIONS */
.lens-controls {
  position:absolute;
  z-index:5;
  top:calc(env(safe-area-inset-top) + 85px);
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}
.small-control {
  min-width:65px;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:30px;
  background:rgba(0,0,0,.4);
  color:rgba(255,255,255,.65);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.5px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.small-control.active {
  color:white;
  border-color:white;
  background:rgba(255,255,255,.12);
}

/* BOTTOM CONTROLS */
.bottom {
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom) + 24px);
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}
.camera-controls {
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:auto;
}
.flip-button {
  position:absolute;
  right:34px;
  width:46px;
  height:46px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.4);
  color:white;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
#shutter {
  width:78px;
  height:78px;
  border:3px solid white;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  touch-action:none;
  outline:none;
}
#shutter::before {
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
}
#shutter .inner {
  width:60px;
  height:60px;
  border-radius:50%;
  background:white;
  transition:all .18s ease;
}
#shutter.recording .inner {
  width:27px;
  height:27px;
  border-radius:7px;
  background:var(--red);
}
#shutter.holding::after {
  content:"";
  position:absolute;
  inset:-8px;
  border:3px solid transparent;
  border-top-color:var(--red);
  border-right-color:var(--red);
  border-radius:50%;
  animation:hold-progress 2s linear forwards;
}
@keyframes hold-progress {
  from {transform:rotate(0deg);}
  to {transform:rotate(360deg);}
}
.instruction {
  margin-top:22px;
  color:rgba(255,255,255,.65);
  font-size:9px;
  font-weight:600;
  letter-spacing:2px;
  text-align:center;
}
.tagline {
  margin-top:12px;
  color:rgba(255,255,255,.35);
  font-size:9px;
  letter-spacing:3px;
  text-align:center;
}

/* START SCREEN */
#startScreen {
  position:absolute;
  z-index:10;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:var(--black);
  padding:30px;
  text-align:center;
}
.start-logo {
  width:min(75vw,330px);
  height:auto;
  margin-bottom:35px;
}
#startScreen p {
  max-width:270px;
  color:#888;
  font-size:12px;
  line-height:1.7;
  letter-spacing:1px;
  margin:0 0 28px;
}
#startButton {
  border:1px solid white;
  background:white;
  color:black;
  border-radius:30px;
  padding:15px 30px;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}
#errorMessage {
  color:#e66;
  font-size:11px;
  line-height:1.5;
  max-width:290px;
  margin-top:20px;
}
#statusMessage {
  position:absolute;
  z-index:8;
  bottom:calc(env(safe-area-inset-bottom) + 145px);
  left:20px;
  right:20px;
  text-align:center;
  font-size:10px;
  letter-spacing:1.5px;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}
#statusMessage.show { opacity:1; }

@media (orientation:landscape) {
  .top {
    top:calc(env(safe-area-inset-top) + 10px);
  }
  .logo { width:110px; }
  .lens-controls {
    top:calc(env(safe-area-inset-top) + 12px);
  }
  .bottom {
    bottom:calc(env(safe-area-inset-bottom) + 10px);
  }
  #shutter {
    width:68px;
    height:68px;
  }
  #shutter .inner {
    width:52px;
    height:52px;
  }
  .instruction { margin-top:10px; }
  .tagline { margin-top:6px; }
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay muted playsinline></video>
<canvas id="cameraCanvas"></canvas>

<header class="top">
  <img class="logo" src="680A3BE0-D839-47C8-8C90-0FE9BD1F2173.png" alt="REWIND">
  <div class="recording-label" id="recordingLabel">
    <span class="recording-dot"></span>
    <span id="recordingTime">REC 00:00</span>
  </div>
</header>

<div class="lens-controls">
  <button class="small-control active" id="circleButton">CIRCLE</button>
  <button class="small-control" id="ovalButton">OVAL</button>
</div>

<div class="bottom">
  <div class="camera-controls">
    <button class="flip-button" id="flipButton" aria-label="Switch camera">↻</button>
    <button id="shutter" aria-label="Take photo or record video">
      <span class="inner"></span>
    </button>
  </div>
  <div class="instruction" id="instruction">
    TAP PHOTO · HOLD 2 SECONDS TO RECORD
  </div>
  <div class="tagline">YOUR MOMENT. REWOUND.</div>
</div>

<div id="statusMessage"></div>

<div id="startScreen">
  <img class="start-logo" src="680A3BE0-D839-47C8-8C90-0FE9BD1F2173.png" alt="REWIND">
  <p>A different way to capture the moment. Allow camera access to begin.</p>
  <button id="startButton">OPEN CAMERA</button>
  <div id="errorMessage"></div>
</div>

<script>
"use strict";

const video=document.getElementById("cameraVideo");
const canvas=document.getElementById("cameraCanvas");
const gl=canvas.getContext("webgl",{
  alpha:false,
  antialias:true,
  preserveDrawingBuffer:true
});

const shutter=document.getElementById("shutter");
const startScreen=document.getElementById("startScreen");
const startButton=document.getElementById("startButton");
const errorMessage=document.getElementById("errorMessage");
const statusMessage=document.getElementById("statusMessage");
const recordingLabel=document.getElementById("recordingLabel");
const recordingTime=document.getElementById("recordingTime");
const instruction=document.getElementById("instruction");

let cameraStream=null;
let facingMode="environment";
let cameraReady=false;
let recorder=null;
let recordedChunks=[];
let recording=false;
let recordingStartedAt=0;
let recordingClock=null;
let holdTimer=null;
let longPressTriggered=false;
let pointerDown=false;
let lensShape=0;
let animationFrame=null;
let texture=null;
let program=null;
let statusTimeout=null;

const vertexShaderSource=`
attribute vec2 position;
varying vec2 vUv;
void main(){
  vUv=position*.5+.5;
  gl_Position=vec4(position,0.,1.);
}`;

const fragmentShaderSource=`
precision highp float;
varying vec2 vUv;
uniform sampler2D uVideo;
uniform vec2 uResolution;
uniform vec2 uVideoResolution;
uniform float uShape;
uniform float uTime;

void main(){
  vec2 p=(vUv-.5)*2.0;
  float aspect=uResolution.x/uResolution.y;
  p.x*=aspect;

  float radiusX=aspect*.94;
  float radiusY=radiusX;
  if(uShape>.5) radiusY=aspect*.71;

  vec2 lens=vec2(p.x/radiusX,p.y/radiusY);
  float r=length(lens);

  if(r>1.0){
    gl_FragColor=vec4(0.,0.,0.,1.);
    return;
  }

  float maxAngle=1.32;
  float theta=r*maxAngle;
  float mapped=tan(theta)/tan(maxAngle);
  vec2 direction=r>.0001?lens/r:vec2(0.);
  vec2 warped=direction*mapped;

  float videoAspect=uVideoResolution.x/uVideoResolution.y;
  vec2 uv=vec2(.5);

  if(videoAspect>aspect){
    uv.x+=warped.x*(aspect/videoAspect)*.5;
    uv.y+=warped.y*.5;
  }else{
    uv.x+=warped.x*.5;
    uv.y+=warped.y*(videoAspect/aspect)*.5;
  }

  uv=clamp(uv,vec2(.001),vec2(.999));

  float aberration=pow(r,3.0)*.004;
  vec2 offset=direction*aberration;

  float red=texture2D(uVideo,clamp(uv+offset,.001,.999)).r;
  float green=texture2D(uVideo,uv).g;
  float blue=texture2D(uVideo,clamp(uv-offset,.001,.999)).b;

  vec3 colour=vec3(red,green,blue);

  float centreGlow=1.0+.12*exp(-r*r*5.0);
  float edgeFalloff=1.0-.34*smoothstep(.12,1.0,r);
  float directionalLight=1.0-.09*smoothstep(-.4,1.0,lens.y);
  float vignette=1.0-.57*smoothstep(.48,1.0,r);

  colour*=centreGlow*edgeFalloff*directionalLight*vignette;

  colour.r*=1.035;
  colour.g*=1.005;
  colour.b*=.965;

  float grain=fract(sin(dot(gl_FragCoord.xy+uTime,vec2(12.9898,78.233)))*43758.5453);
  colour+=(grain-.5)*.025;

  float edge=1.0-smoothstep(.985,1.0,r);
  gl_FragColor=vec4(mix(vec3(0.),colour,edge),1.);
}`;

function createShader(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

function setupWebGL(){
  if(!gl) throw new Error("WebGL is unavailable.");

  const vs=createShader(gl.VERTEX_SHADER,vertexShaderSource);
  const fs=createShader(gl.FRAGMENT_SHADER,fragmentShaderSource);

  program=gl.createProgram();
  gl.attachShader(program,vs);
  gl.attachShader(program,fs);
  gl.linkProgram(program);

  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
    throw new Error(gl.getProgramInfoLog(program));
  }

  gl.useProgram(program);

  const buffer=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
    -1,-1,1,-1,-1,1,1,1
  ]),gl.STATIC_DRAW);

  const position=gl.getAttribLocation(program,"position");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

  texture=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
}

function resizeCanvas(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const width=Math.round(innerWidth*dpr);
  const height=Math.round(innerHeight*dpr);

  if(canvas.width!==width||canvas.height!==height){
    canvas.width=width;
    canvas.height=height;
  }

  if(gl) gl.viewport(0,0,canvas.width,canvas.height);
}

function render(now=0){
  if(!gl||!program) return;

  if(video.readyState>=video.HAVE_CURRENT_DATA){
    gl.useProgram(program);
    gl.bindTexture(gl.TEXTURE_2D,texture);

    try{
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
    }catch(e){}

    gl.uniform1i(gl.getUniformLocation(program,"uVideo"),0);
    gl.uniform2f(gl.getUniformLocation(program,"uResolution"),canvas.width,canvas.height);
    gl.uniform2f(gl.getUniformLocation(program,"uVideoResolution"),video.videoWidth||1,video.videoHeight||1);
    gl.uniform1f(gl.getUniformLocation(program,"uShape"),lensShape);
    gl.uniform1f(gl.getUniformLocation(program,"uTime"),now*.001);

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  animationFrame=requestAnimationFrame(render);
}

async function startCamera(){
  errorMessage.textContent="";
  startButton.textContent="OPENING CAMERA";

  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Open REWIND in Safari using its HTTPS address.");
    }

    if(cameraStream){
      cameraStream.getTracks().forEach(track=>track.stop());
    }

    cameraStream=await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:{
        facingMode:{ideal:facingMode},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    });

    video.srcObject=cameraStream;
    await video.play();
    cameraReady=true;

    if(!program) setupWebGL();

    startScreen.style.display="none";
    resizeCanvas();
    cancelAnimationFrame(animationFrame);
    animationFrame=requestAnimationFrame(render);

  }catch(error){
    console.error(error);
    errorMessage.textContent=error.message||"Unable to access the camera. Check camera permissions.";
    startButton.textContent="TRY AGAIN";
  }
}

startButton.addEventListener("click",startCamera);

document.getElementById("flipButton").addEventListener("click",async()=>{
  if(recording){
    showStatus("STOP RECORDING FIRST");
    return;
  }

  facingMode=facingMode==="environment"?"user":"environment";
  await startCamera();
});

function setLens(shape){
  lensShape=shape;
  document.getElementById("circleButton").classList.toggle("active",shape===0);
  document.getElementById("ovalButton").classList.toggle("active",shape===1);
}

document.getElementById("circleButton").addEventListener("click",()=>setLens(0));
document.getElementById("ovalButton").addEventListener("click",()=>setLens(1));

function showStatus(message){
  statusMessage.textContent=message;
  statusMessage.classList.add("show");
  clearTimeout(statusTimeout);
  statusTimeout=setTimeout(()=>statusMessage.classList.remove("show"),2200);
}

async function saveFile(blob,filename){
  const file=new File([blob],filename,{type:blob.type});

  if(navigator.share&&navigator.canShare?.({files:[file]})){
    try{
      await navigator.share({files:[file],title:"REWIND"});
      return;
    }catch(error){
      if(error.name==="AbortError") return;
    }
  }

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),15000);
}

function takePhoto(){
  if(!cameraReady||recording) return;

  canvas.toBlob(async blob=>{
    if(!blob){
      showStatus("PHOTO COULD NOT BE SAVED");
      return;
    }

    await saveFile(blob,"REWIND-"+Date.now()+".jpg");
    showStatus("PHOTO CAPTURED");
  },"image/jpeg",.96);
}

function startRecording(){
  if(!cameraReady||recording) return;

  if(!canvas.captureStream||!window.MediaRecorder){
    showStatus("VIDEO RECORDING NOT SUPPORTED");
    return;
  }

  try{
    const recordingStream=canvas.captureStream(30);
    cameraStream.getAudioTracks().forEach(track=>recordingStream.addTrack(track));

    const formats=[
      "video/mp4;codecs=avc1.42E01E",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];

    const mimeType=formats.find(type=>MediaRecorder.isTypeSupported(type));
    recorder=new MediaRecorder(recordingStream,mimeType?{mimeType}:{});
    recordedChunks=[];

    recorder.ondataavailable=event=>{
      if(event.data?.size) recordedChunks.push(event.data);
    };

    recorder.onerror=event=>{
      console.error(event);
      showStatus("RECORDING ERROR");
    };

    recorder.onstop=async()=>{
      const type=recorder.mimeType||"video/webm";
      const extension=type.includes("mp4")?"mp4":"webm";
      const blob=new Blob(recordedChunks,{type});

      recordingStream.getTracks().forEach(track=>track.stop());

      if(blob.size){
        await saveFile(blob,"REWIND-VIDEO-"+Date.now()+"."+extension);
        showStatus("VIDEO READY TO SAVE");
      }else{
        showStatus("VIDEO COULD NOT BE SAVED");
      }

      recordedChunks=[];
    };

    recorder.start(250);
    recording=true;
    recordingStartedAt=Date.now();

    shutter.classList.add("recording");
    recordingLabel.classList.add("active");
    instruction.textContent="TAP AGAIN TO STOP RECORDING";

    updateRecordingClock();
    recordingClock=setInterval(updateRecordingClock,250);

  }catch(error){
    console.error(error);
    showStatus("COULD NOT START RECORDING");
  }
}

function stopRecording(){
  if(!recording||!recorder) return;

  recording=false;
  clearInterval(recordingClock);

  shutter.classList.remove("recording");
  recordingLabel.classList.remove("active");
  instruction.textContent="TAP PHOTO · HOLD 2 SECONDS TO RECORD";

  if(recorder.state!=="inactive") recorder.stop();
}

function updateRecordingClock(){
  if(!recording) return;

  const seconds=Math.floor((Date.now()-recordingStartedAt)/1000);

  recordingTime.textContent="REC "+
    String(Math.floor(seconds/60)).padStart(2,"0")+":"+
    String(seconds%60).padStart(2,"0");
}

/* SHUTTER:
   Tap = photo.
   Hold 2 seconds = start video.
   Release = continue recording.
   Next tap = stop video.
*/
function shutterDown(event){
  event.preventDefault();
  if(!cameraReady) return;

  pointerDown=true;
  longPressTriggered=false;

  if(recording) return;

  shutter.classList.add("holding");

  holdTimer=setTimeout(()=>{
    if(!pointerDown) return;

    longPressTriggered=true;
    shutter.classList.remove("holding");
    startRecording();

  },2000);
}

function shutterUp(event){
  event.preventDefault();
  if(!pointerDown) return;

  pointerDown=false;

  if(holdTimer){
    clearTimeout(holdTimer);
    holdTimer=null;
  }

  shutter.classList.remove("holding");

  if(recording){
    if(longPressTriggered) return;
    stopRecording();
    return;
  }

  if(!longPressTriggered) takePhoto();
}

function shutterCancel(){
  pointerDown=false;

  if(holdTimer){
    clearTimeout(holdTimer);
    holdTimer=null;
  }

  shutter.classList.remove("holding");
}

shutter.addEventListener("pointerdown",shutterDown);
shutter.addEventListener("pointerup",shutterUp);
shutter.addEventListener("pointercancel",shutterCancel);
shutter.addEventListener("contextmenu",event=>event.preventDefault());

window.addEventListener("resize",resizeCanvas);
window.addEventListener("orientationchange",()=>setTimeout(resizeCanvas,250));

window.addEventListener("pagehide",()=>{
  cancelAnimationFrame(animationFrame);
  clearInterval(recordingClock);

  if(holdTimer) clearTimeout(holdTimer);

  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
  }
});
</script>
</body>
</html>
